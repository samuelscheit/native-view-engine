# ast-grep configuration for native-view-engine (L2 hybrid lint layer)
# Run `ast-grep test` to verify all rule unit tests (`ast-grep test -U` to update snapshots)
# and `ast-grep scan` to lint the repository.

ruleDirs:
  - lints/ast-grep/rules
utilDirs:
  - lints/ast-grep/utils
testConfigs:
  - testDir: lints/ast-grep/tests
languageGlobs:
  cpp:
    - "*.h"
    - "*.mm"
    - "*.m"
  javascript:
    - "*.mjs"
    - "*.cjs"
