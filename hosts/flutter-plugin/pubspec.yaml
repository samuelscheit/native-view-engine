name: nve_flutter
description: >-
  Native View Engine (NVE) Flutter host: renders a libnve_runtime surface (attached
  nve_get_interface app, live pairing, or NVE2 replay) on Flutter's own Canvas via
  dart:ffi and package:nve_host (NveCanvasView / NveCanvasController).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  nve_host:
    path: ../../packages/core/host-dart

dev_dependencies:
  flutter_test:
    sdk: flutter
