name: nve_flutter
description: >-
  Native View Engine (NVE) Flutter host package. Embeds NVE Rust components directly
  onto Flutter's Canvas via dart:ffi (NveCanvasView / NveCanvasController), modular
  nve_get_interface bindings, NvePairClient live pairing, and NveChannelBus stream bridging.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # Static host runtime + generated ABI / table data (`nve codegen abi`).
  nve_host:
    path: ../../packages/core/host-dart

dev_dependencies:
  flutter_test:
    sdk: flutter
