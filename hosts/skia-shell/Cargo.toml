[package]
name = "nve-skia-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nve-skia-shell"
path = "src/main.rs"

[features]
default = []
# CPU-backed Skia canvas + raster surface
skia = ["nve-backend-skia/skia"]
# Apple Metal hardware GPU swapchain & offscreen context (macOS / iOS)
skia-metal = ["skia", "nve-backend-skia/skia-metal"]
# Cross-platform Vulkan hardware GPU swapchain & offscreen context (Linux / Android / Windows / MoltenVK)
skia-vulkan = ["skia", "nve-backend-skia/skia-vulkan"]
# Windows Direct3D 12 + DXGI hardware GPU swapchain & offscreen context
skia-d3d = ["skia", "nve-backend-skia/skia-d3d"]
# Real React Native Yoga C++20 layout engine integration (compiled when RN_REACT_COMMON_DIR is set)
yoga = ["nve-backend-skia/yoga"]

[dependencies]
nve-abi = { workspace = true }
nve-store = { workspace = true }
nve-tables = { workspace = true }
nve-canvas = { workspace = true }
nve-canvas-skia = { workspace = true }
nve-motion-skia = { workspace = true }
nve-svg-skia = { workspace = true }
nve-engine = { workspace = true }
nve-backend-skia = { workspace = true }
nve-interop = { workspace = true }
nve-wire = { workspace = true }
nve-host-services = { workspace = true }
nve-clipboard = { workspace = true }
nve-filesystem = { workspace = true }
nve-secure-store = { workspace = true }
nve-linking = { workspace = true }
nve-system-env = { workspace = true }
nve-haptics = { workspace = true }
winit = { workspace = true }
softbuffer = { workspace = true }
tungstenite = { workspace = true }
crossbeam-channel = { workspace = true }

[dev-dependencies]
nve-dioxus = { workspace = true }

[lints]
workspace = true
