[package]
name = "nve-web-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Native tests link `rlib`; `hosts/web-shell/build.sh` passes `--crate-type cdylib`
# for `wasm32-unknown-unknown` so workspace tests never link a redundant native cdylib.
crate-type = ["rlib"]

[features]
# Default = the `nve dev` / test shell: both demo apps and all dev infrastructure.
# Production bundles (hosts/web-shell/build.sh): `--no-default-features --features app-studio`
# (or `app-kitchen-sink`): exactly one app, no hot reload, pairing, popups or scene mirror.
default = ["app-studio", "app-kitchen-sink", "dev", "multi-window", "scene-view"]
app-studio = ["dep:nve-studio-workspace", "nve-studio-workspace/web"]
app-kitchen-sink = ["dep:nve-example-kitchen-sink", "nve-example-kitchen-sink/web"]
app-issues = [
    "nve-example-issues-client/web",
    "dep:base64",
    "dep:bytes",
    "dep:nve-rpc",
    "dep:nve-query",
    "dep:nve-http-web",
    "dep:nve-query-dioxus",
    "dep:nve-example-issues-api",
    "dep:nve-example-issues-client",
    "dep:dioxus-core",
]
# Opt-in browser E2E probes for `FetchTransport`, cross-origin CORS, native overlays (a real
# `nve-ui` `Dialog`), hydration parity, and a live `nve-tv-web` D-Pad controller (excluded from
# production `app-issues`).
issues-probes = ["app-issues", "dep:nve-ui", "dep:dioxus-core-macro", "dep:nve-tv-web"]
# `nve dev` Tier-1/2 hot-reload WebSocket (binary NVP1), the `NveWebHost` NVT1/NVD1 pairing client
# and the semantic-style hydration probe used by the E2E suite.
dev = ["dep:nve-canvas", "dep:nve-canvas-web"]
# Popup windows + `NVW1` `BroadcastChannel` window sync (`nve-interop` WindowManager).
multi-window = []
# Per-frame `NveSceneTable` mirror behind `nve_web_scene_view_ptr` (zero-copy JS inspection).
scene-view = []

[dependencies]
nve-abi = { workspace = true }
nve-system-env = { workspace = true }
nve-store = { workspace = true }
nve-components = { workspace = true }
nve-canvas = { workspace = true, optional = true }
nve-canvas-web = { workspace = true, optional = true }
nve-web-html = { workspace = true }
nve-web-html-web = { workspace = true }
nve-engine = { workspace = true }
nve-dioxus = { workspace = true }
nve-backend-web = { workspace = true }
nve-interop = { workspace = true }
nve-wire-core = { workspace = true }
nve-example-kitchen-sink = { workspace = true, optional = true }
nve-studio-workspace = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
dioxus-core = { workspace = true, optional = true }
dioxus-core-macro = { workspace = true, optional = true }
nve-ui = { workspace = true, optional = true }
nve-tv-web = { workspace = true, optional = true }
nve-rpc = { workspace = true, optional = true }
nve-query = { workspace = true, optional = true }
nve-http-web = { workspace = true, optional = true }
nve-query-dioxus = { workspace = true, optional = true }
nve-example-issues-api = { workspace = true, optional = true }
nve-example-issues-client = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
nve-wire = { workspace = true, features = ["client", "server"] }
tungstenite = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["BinaryType", "BroadcastChannel", "CloseEvent", "ErrorEvent", "History", "Location", "MediaQueryList", "MutationObserver", "MutationObserverInit", "NodeList", "Performance", "ResizeObserver", "Storage", "VisibilityState"] }
# Global allocator on wasm32: smaller (-2.5 KB brotli) and faster than std's dlmalloc
# (docs/research/wasm-size/runtime.md).
talc = "5.1.1"

[[test]]
name = "wasm_dom_tests"
required-features = ["app-studio", "app-kitchen-sink", "dev"]

[lints]
workspace = true
