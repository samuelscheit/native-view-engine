<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1120'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%2338bdf8'/%3E%3C/svg%3E"
		/>
		<title>Aether Workspace · Native View Engine Web WASM</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #0b1120;
				--surface: #111827;
				--border: #1e293b;
				--text: #e2e8f0;
				--muted: #94a3b8;
				--accent: #38bdf8;
				--ok: #22c55e;
				--warn: #f59e0b;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				max-width: 100%;
				min-height: 100vh;
				height: 100%;
				overflow-x: hidden;
				background: #0b1120;
				color: var(--text);
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
				-webkit-font-smoothing: antialiased;
			}

			.shell {
				display: flex;
				flex-direction: column;
				width: 100%;
				max-width: 100%;
				min-height: 100vh;
				height: 100vh;
				overflow: hidden;
				background: #0b1120;
			}

			.topbar {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				justify-content: space-between;
				gap: 8px 12px;
				flex-shrink: 0;
				width: 100%;
				max-width: 100%;
				padding: 8px 12px;
				background: rgba(17, 24, 39, 0.96);
				border-bottom: 1px solid var(--border);
				font-size: 13px;
			}

			.brand {
				display: flex;
				align-items: center;
				gap: 8px;
				min-width: 0;
				font-weight: 600;
				letter-spacing: 0.02em;
			}

			#nve-brand-title {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.brand-dot {
				width: 8px;
				height: 8px;
				border-radius: 999px;
				background: var(--accent);
				box-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
			}

			.topbar-right {
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.app-switcher {
				display: inline-flex;
				align-items: center;
				gap: 4px;
				padding: 2px;
				border-radius: 999px;
				border: 1px solid var(--border);
				background: #0b1120;
			}

			.app-tab {
				padding: 3px 10px;
				border-radius: 999px;
				color: var(--muted);
				text-decoration: none;
				font-size: 12px;
				font-weight: 500;
				transition:
					color 0.15s ease,
					background 0.15s ease;
			}

			.app-tab:hover {
				color: var(--text);
			}

			.app-tab[data-active="true"] {
				background: rgba(56, 189, 248, 0.16);
				color: var(--accent);
			}

			.status-pill {
				padding: 4px 10px;
				border-radius: 999px;
				border: 1px solid var(--border);
				background: #0b1120;
				color: var(--muted);
				font-size: 12px;
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
			}

			.status-pill[data-state="connected"],
			.status-pill[data-state="patched"] {
				color: #86efac;
				border-color: rgba(34, 197, 94, 0.45);
			}

			.status-pill[data-state="reloading"],
			.status-pill[data-state="connecting"] {
				color: #fde68a;
				border-color: rgba(245, 158, 11, 0.45);
			}

			.status-pill[data-state="offline"] {
				color: #fca5a5;
				border-color: rgba(239, 68, 68, 0.45);
			}

			#app {
				flex: 1 1 0;
				width: 100%;
				max-width: 100%;
				min-width: 0;
				min-height: 0;
				overflow: hidden;
				background: #0b1120;
				display: flex;
				flex-direction: column;
			}

			.boot-fallback {
				margin: 24px;
				padding: 20px;
				border-radius: 12px;
				border: 1px solid var(--border);
				background: var(--surface);
				color: var(--muted);
				line-height: 1.5;
			}

			.boot-fallback code {
				color: var(--accent);
			}
		</style>
	</head>
	<body>
		<div class="shell">
			<header class="topbar">
				<div class="brand">
					<span class="brand-dot"></span>
					<span id="nve-brand-title">Aether Workspace + NVE Studio · Web WASM</span>
				</div>
				<div class="topbar-right">
					<nav class="app-switcher" aria-label="NVE Web Demo App">
						<a id="tab-studio" class="app-tab" href="?app=studio" data-active="true">Studio</a>
						<a id="tab-counter" class="app-tab" href="?app=counter" data-active="false">Counter</a>
					</nav>
					<a id="nve-reset-btn" class="app-tab" data-testid="shell-reset-btn" href="?reset=1" title="Clear persisted workspace snapshot & state">Reset</a>
					<div id="nve-status" class="status-pill" data-state="booting">Booting WASM…</div>
				</div>
			</header>
			<main id="app">
				<div class="boot-fallback">Loading the NVE Web WASM bundle…</div>
			</main>
		</div>

		<script data-nve-snapshot-boot>(()=>{try{let L=localStorage,D=document,a=D.getElementById('app'),q=new URL(location).searchParams,g=x=>q.get(x),p=(g('app')||'studio').toLowerCase(),v=p=='counter'?1:2,Z=':'+p+':v'+v,k='nve:snap'+Z,s='nve:state'+Z;if(g('reset')==1)return delete L[k],delete L[s];if(!a||g('pair')||g('ssr'))return;let r=L[k],i=r?.indexOf('\n');if(!L[s]||i<6||!/^NVWS1\|/.test(r))return;let[u,,z,...n]=r.slice(6,i).split('|'),o=i+1,[H,B,C,M]=n.map(x=>r.slice(o,o+=+x));if(+u!=v||n.length-4||!M||o!=r.length)return;let S=(t,c,h)=>{t='data-nve-'+t;let e=D.querySelector('['+t+']')||D.head.appendChild(D.createElement('style'));e.setAttribute(t,'');h&&(e.dataset.nveHashes=h);e.textContent=c};S('base',B);S('ssr',C,H);a.innerHTML=M;a.dataset.nveRestored=1;if(z){let V=a.querySelectorAll('.nve-s');z.replace(/(\d+):(\d+)/g,(_,j,y)=>V[j]&&(V[j].scrollTop=y))}}catch{}})();</script>

		<script type="module">
			const statusEl = document.getElementById("nve-status");
			const appEl = document.getElementById("app");
			const brandTitleEl = document.getElementById("nve-brand-title");
			const tabStudio = document.getElementById("tab-studio");
			const tabCounter = document.getElementById("tab-counter");
			const resetBtn = document.getElementById("nve-reset-btn");

			const params = new URLSearchParams(window.location.search);
			const appParam = (params.get("app") || "studio").trim().toLowerCase();
			const isCounter = appParam === "counter";
			const pairParam = (params.get("pair") || "").trim();
			const pairToken = (params.get("token") || params.get("pair_token") || "").trim();
			const isPaired = pairParam.length > 0;
			// `nve dev` hot reload: `?ws=<url>`, or `?dev` for the default `ws://<host>:8089`.
			const wsParam = (params.get("ws") || "").trim();
			const hotReloadWsUrl =
				wsParam === "off" || wsParam === "none"
					? null
					: wsParam || (params.has("dev") ? `ws://${window.location.hostname}:8089` : null);
			// One production bundle per app (`pkg/studio`, `pkg/counter`); hot reload and pairing
			// live only in `pkg/dev` (hosts/web-shell/build.sh). `?bundle=<name>` overrides.
			const BUNDLES = ["studio", "counter", "dev"];
			const bundleParam = (params.get("bundle") || "").trim().toLowerCase();
			const bundle = BUNDLES.includes(bundleParam)
				? bundleParam
				: isPaired || hotReloadWsUrl
					? "dev"
					: isCounter
						? "counter"
						: "studio";
			window.__nveBundle = bundle;

			// Preserve any `?ws=...` setting when switching apps via the topbar links.
			const buildAppHref = (appName) => {
				const next = new URLSearchParams(window.location.search);
				next.delete("pair");
				next.delete("token");
				next.delete("pair_token");
				next.delete("reset");
				// A production bundle holds one app; only the dev bundle can switch apps.
				if (next.get("bundle") !== "dev") next.delete("bundle");
				if (appName === "studio") {
					next.delete("app");
				} else {
					next.set("app", appName);
				}
				const qs = next.toString();
				return qs ? `?${qs}` : window.location.pathname;
			};

			const buildResetHref = () => {
				const next = new URLSearchParams(window.location.search);
				next.delete("pair");
				next.delete("token");
				next.delete("pair_token");
				next.set("reset", "1");
				return `?${next.toString()}`;
			};

			if (tabStudio) {
				tabStudio.href = buildAppHref("studio");
				tabStudio.dataset.active = String(!isPaired && !isCounter);
			}
			if (tabCounter) {
				tabCounter.href = buildAppHref("counter");
				tabCounter.dataset.active = String(!isPaired && isCounter);
			}
			if (resetBtn) {
				resetBtn.href = buildResetHref();
				if (isPaired) resetBtn.style.display = "none";
			}
			if (statusEl && appEl && appEl.dataset.nveRestored === "1") {
				statusEl.textContent = "Instant snapshot · booting…";
				statusEl.dataset.state = "connecting";
			}
			if (isPaired) {
				document.title = "Paired Live View · Native View Engine Web WASM";
				if (brandTitleEl) {
					brandTitleEl.textContent = "Native View Engine · Live Paired Client (QUIC/WebTransport + WS)";
				}
			} else if (isCounter) {
				document.title = "Counter · Native View Engine Web WASM";
				if (brandTitleEl) {
					brandTitleEl.textContent = "Native View Engine · Counter (Web WASM)";
				}
			}

			function hexToUint8Array(hex) {
				const clean = (hex || "").replace(/[^0-9a-fA-F]/g, "");
				if (clean.length !== 64) return null;
				const out = new Uint8Array(32);
				for (let i = 0; i < 32; i++) {
					out[i] = parseInt(clean.slice(i * 2, i * 2 + 2), 16);
				}
				return out;
			}

			function parsePairTarget(rawPair, explicitToken) {
				const pageParams = new URLSearchParams(window.location.search);
				const explicitCertHash = (pageParams.get("cert_hash") || "").trim();
				const explicitWtUrl = (pageParams.get("wt") || "").trim();
				if (/^nve:\/\/pair/i.test(rawPair)) {
					const parsed = new URL(rawPair.replace(/^nve:\/\//i, "http://"));
					const host = (parsed.searchParams.get("host") || window.location.hostname || "127.0.0.1").trim();
					const wsPort = (parsed.searchParams.get("wss") || parsed.searchParams.get("ws") || "").trim();
					const quicPort = (parsed.searchParams.get("quic") || parsed.searchParams.get("udp") || "").trim();
					const uriToken = (parsed.searchParams.get("token") || "").trim();
					const certHash = (parsed.searchParams.get("cert_hash") || explicitCertHash).trim();
					if (!wsPort && !quicPort) {
						throw new Error("nve://pair URI is missing quic=<port> or wss=<port> parameter.");
					}
					const proto = window.location.protocol === "https:" ? "wss://" : "ws://";
					const hostPart = host.includes(":") && !host.startsWith("[") ? `[${host}]` : host;
					return {
						wsUrl: wsPort ? `${proto}${hostPart}:${wsPort}/nve-wire` : "",
						wtUrl: quicPort ? `https://${hostPart}:${quicPort}/nve-wire` : explicitWtUrl,
						certHash,
						token: explicitToken || uriToken,
					};
				}
				const wsUrl = /^wss?:\/\//i.test(rawPair)
					? rawPair
					: `${window.location.protocol === "https:" ? "wss://" : "ws://"}${rawPair}`;
				return { wsUrl, wtUrl: explicitWtUrl, certHash: explicitCertHash, token: explicitToken };
			}

			function setPairConnectionAttrs(state, connected, extra = {}) {
				if (statusEl) {
					statusEl.dataset.mode = "paired";
					statusEl.dataset.pairState = state;
					statusEl.dataset.pairConnected = String(Boolean(connected));
					if (extra.url !== undefined) statusEl.dataset.pairUrl = extra.url;
					if (extra.sessionId !== undefined) statusEl.dataset.pairSessionId = String(extra.sessionId);
					if (extra.frames !== undefined) statusEl.dataset.pairFrames = String(extra.frames);
				}
				if (appEl) {
					appEl.dataset.nveMode = "paired";
					appEl.dataset.pairState = state;
					appEl.dataset.pairConnected = String(Boolean(connected));
					if (extra.frames !== undefined) appEl.dataset.pairFrames = String(extra.frames);
				}
			}

			async function tryWebTransportConnect(host, wtUrl, certHashHex) {
				if (typeof window.WebTransport !== "function" || !wtUrl) return null;
				const hashBytes = hexToUint8Array(certHashHex);
				const opts = hashBytes
					? { serverCertificateHashes: [{ algorithm: "sha-256", value: hashBytes }] }
					: {};
				const transport = new window.WebTransport(wtUrl, opts);
				await Promise.race([
					transport.ready,
					new Promise((_, reject) => setTimeout(() => reject(new Error("WebTransport timeout")), 400)),
				]);
				const bi = await transport.createBidirectionalStream();
				const writer = bi.writable.getWriter();
				const reader = bi.readable.getReader();
				await writer.write(host.build_pair_hello());
				return { transport, writer, reader };
			}

			function bootPairedClient(wasmMod, rawPairUrl, explicitToken) {
				const { wsUrl, wtUrl, certHash, token } = parsePairTarget(rawPairUrl, explicitToken);
				if (!token) {
					throw new Error("Missing ?token=<pairing_token> query parameter for ?pair= live pairing mode.");
				}
				const targetLabel = wtUrl || wsUrl;
				setPairConnectionAttrs("connecting", false, { url: targetLabel, sessionId: 0, frames: 0 });
				if (statusEl) {
					statusEl.textContent = "Pair: connecting…";
					statusEl.dataset.state = "connecting";
				}
				const host = wasmMod.NveWebHost.create_paired("app", token);
				window.__nvePairHost = host;
				if (wtUrl && certHash && typeof window.WebTransport === "function" && !wsUrl) {
					tryWebTransportConnect(host, wtUrl, certHash).catch((err) => {
						console.warn("[NVE Pair] WebTransport connect failed:", err);
					});
					return host;
				}
				const ws = new WebSocket(wsUrl);
				ws.binaryType = "arraybuffer";
				host.attach_pair_socket(ws);

				const sendBinary = (bytes) => {
					if (bytes && bytes.length > 0 && ws.readyState === WebSocket.OPEN) {
						ws.send(bytes);
					}
				};

				ws.addEventListener("open", () => {
					setPairConnectionAttrs("authenticating", false, {
						url: wsUrl,
						sessionId: host.session_id(),
						frames: host.frames_received(),
					});
					if (statusEl) {
						statusEl.textContent = "Pair: authenticating…";
						statusEl.dataset.state = "connecting";
					}
					sendBinary(host.build_pair_hello());
				});

				ws.addEventListener("message", (ev) => {
					if (!(ev.data instanceof ArrayBuffer)) {
						return;
					}
					try {
						const reply = host.on_pair_binary_message(new Uint8Array(ev.data));
						sendBinary(reply);
						let extra;
						while ((extra = host.take_outbound_message()) && extra.length > 0) {
							sendBinary(extra);
						}
						const connected = host.is_connected();
						setPairConnectionAttrs(connected ? "connected" : "authenticating", connected, {
							url: wsUrl,
							sessionId: host.session_id(),
							frames: host.frames_received(),
						});
					} catch (err) {
						console.error("[NVE Pair] Binary frame error:", err);
						setPairConnectionAttrs("error", false, {
							url: wsUrl,
							sessionId: host.session_id(),
							frames: host.frames_received(),
						});
						if (statusEl) {
							statusEl.textContent = `Pair error: ${err}`;
							statusEl.dataset.state = "offline";
						}
					}
				});

				ws.addEventListener("error", () => {
					setPairConnectionAttrs("error", false, {
						url: wsUrl,
						sessionId: host.session_id(),
						frames: host.frames_received(),
					});
					if (statusEl) {
						statusEl.textContent = "Pair: socket error";
						statusEl.dataset.state = "offline";
					}
				});

				ws.addEventListener("close", () => {
					setPairConnectionAttrs("disconnected", false, {
						url: wsUrl,
						sessionId: host.session_id(),
						frames: host.frames_received(),
					});
					if (statusEl) {
						statusEl.textContent = "Pair: disconnected";
						statusEl.dataset.state = "offline";
					}
				});

				window.addEventListener(
					"pagehide",
					() => {
						try {
							host.disconnect();
						} catch {}
					},
					{ once: true }
				);

				window.__nvePairHost = host;
				window.__nvePairSocket = ws;
				return host;
			}

			async function boot() {
				try {
					// build.sh publishes each bundle under a content-hashed directory (immutable) and names
					// its entry files in manifest.json, which is always revalidated. The wasm download starts
					// in parallel with the JS glue import and is compiled while streaming.
					const pkgUrl = new URL(`./pkg/${bundle}/`, window.location.href);
					const manifestRes = await fetch(new URL("manifest.json", pkgUrl), { cache: "no-cache" });
					if (!manifestRes.ok) throw new Error(`pkg/${bundle}/manifest.json: HTTP ${manifestRes.status}`);
					const manifest = await manifestRes.json();
					const wasmResponse = fetch(new URL(manifest.wasm, pkgUrl));
					wasmResponse.catch(() => {});
					const wasmMod = await import(new URL(manifest.js, pkgUrl).href);
					await wasmMod.default({ module_or_path: wasmResponse });
					window.__nveWasmMod = wasmMod;

					if (isPaired) {
						bootPairedClient(wasmMod, pairParam, pairToken);
					} else {
						const mode = isCounter ? "counter" : "studio";
						const ssrParam = params.get("ssr");
						const wantSsrDemo = ssrParam === "1" || ssrParam === "true";
						if (statusEl) statusEl.dataset.mode = mode;
						if (appEl) appEl.dataset.nveMode = mode;

						if (wantSsrDemo && appEl) {
							const ssr = isCounter
								? wasmMod.render_counter_ssr_bundle()
								: wasmMod.render_studio_ssr_bundle();
							const baseStyle = document.createElement("style");
							baseStyle.setAttribute("data-nve-base", "");
							baseStyle.textContent = ssr.base_css;
							const ssrStyle = document.createElement("style");
							ssrStyle.setAttribute("data-nve-ssr", "");
							ssrStyle.setAttribute("data-nve-hashes", ssr.rule_hashes_csv);
							ssrStyle.textContent = ssr.style_css;
							document.head.append(baseStyle, ssrStyle);
							appEl.innerHTML = ssr.html;
							window.__nveSsrPreHydrate = {
								rootEl: appEl.querySelector('[data-nve-id="1"]'),
								searchInput: appEl.querySelector('[testid="board-search-input"]'),
								statusBtn: appEl.querySelector('[testid="task-status-1"]'),
								ruleCount: ssr.rule_count,
								rootHash: ssr.root_hash_hex,
								htmlBytes: ssr.html.length,
								cssBytes: ssr.style_css.length,
							};
						}

						const hasPreRenderedSsr = Boolean(appEl && appEl.querySelector("[data-nve-ssr-hash]"));
						const controller = hasPreRenderedSsr
							? isCounter
								? wasmMod.hydrate_counter_app("app", hotReloadWsUrl)
								: wasmMod.hydrate_studio_workspace_app("app", hotReloadWsUrl)
							: isCounter
								? wasmMod.start_counter_app("app", hotReloadWsUrl)
								: wasmMod.start_studio_workspace_app("app", hotReloadWsUrl);
						window.__nveController = controller;
						if (appEl && appEl.querySelector("[data-nve-island]")) {
							window.__nveIslandHost = wasmMod.ProgressiveIslandHost.attach("app");
						}
					}
				} catch (err) {
					console.error("[NVE Web] Boot failed:", err);
					const hasInstantPaint = Boolean(
						appEl && (appEl.dataset.nveRestored === "1" || appEl.querySelector("[data-nve-ssr-hash]"))
					);
					if (statusEl) {
						statusEl.textContent = hasInstantPaint ? "Snapshot (offline)" : "Boot error";
						statusEl.dataset.state = "offline";
					}
					if (appEl && !hasInstantPaint) {
						appEl.innerHTML = `
              <div class="boot-fallback">
                <strong>Failed to load the <code>${bundle}</code> NVE Web WASM bundle.</strong><br />
                Run <code>./hosts/web-shell/build.sh</code> (or <code>--dev</code>) from the repository root, then serve
                <code>hosts/web-shell</code> over HTTP.<br /><br />
                <code>${String(err)}</code>

            `;
