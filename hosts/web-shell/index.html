<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Native View Engine — Web WASM Shell</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020617;
        --surface: #0f172a;
        --border: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --ok: #22c55e;
        --warn: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 18px;
        background: rgba(15, 23, 42, 0.92);
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .brand-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
      }

      .status-pill {
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #0b1220;
        color: var(--muted);
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .status-pill[data-state="connected"],
      .status-pill[data-state="patched"] {
        color: #86efac;
        border-color: rgba(34, 197, 94, 0.45);
      }

      .status-pill[data-state="reloading"],
      .status-pill[data-state="connecting"] {
        color: #fde68a;
        border-color: rgba(245, 158, 11, 0.45);
      }

      #app {
        flex: 1;
        width: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .boot-fallback {
        margin: 24px;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--muted);
        line-height: 1.5;
      }

      .boot-fallback code {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot"></span>
          <span>Native View Engine · Web WASM</span>
        </div>
        <div id="nve-status" class="status-pill" data-state="booting">Booting WASM…</div>
      </header>
      <main id="app">
        <div class="boot-fallback">
          Loading <code>./pkg/nve_web_shell.js</code>…
        </div>
      </main>
    </div>

    <script type="module">
      const statusEl = document.getElementById("nve-status");
      const appEl = document.getElementById("app");

      const params = new URLSearchParams(window.location.search);
      const wsParam = params.get("ws");
      const hotReloadWsUrl =
        wsParam === "off" || wsParam === "none"
          ? null
          : wsParam || "ws://127.0.0.1:8089";

      async function boot() {
        try {
          const wasmMod = await import("./pkg/nve_web_shell.js");
          await wasmMod.default();
          wasmMod.start_counter_app("app", hotReloadWsUrl);
        } catch (err) {
          console.error("[NVE Web] Boot failed:", err);
          if (statusEl) {
            statusEl.textContent = "Boot error";
            statusEl.dataset.state = "offline";
          }
          if (appEl) {
            appEl.innerHTML = `
              <div class="boot-fallback">
                <strong>Failed to load NVE Web WASM bundle.</strong><br />
                Run <code>./hosts/web-shell/build.sh</code> from the repository root, then serve
                <code>hosts/web-shell</code> over HTTP.<br /><br />
                <code>${String(err)}</code>
              </div>
            `;
          }
        }
      }

      boot();
    </script>
  </body>
</html>
