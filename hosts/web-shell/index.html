<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1120'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%2338bdf8'/%3E%3C/svg%3E"
		/>
		<title>Aether Workspace · Native View Engine Web WASM</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #0b1120;
				--surface: #111827;
				--border: #1e293b;
				--text: #e2e8f0;
				--muted: #94a3b8;
				--accent: #38bdf8;
				--ok: #22c55e;
				--warn: #f59e0b;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				max-width: 100%;
				min-height: 100vh;
				height: 100%;
				overflow-x: hidden;
				background: #0b1120;
				color: var(--text);
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
				-webkit-font-smoothing: antialiased;
			}

			.shell {
				display: flex;
				flex-direction: column;
				width: 100%;
				max-width: 100%;
				min-height: 100vh;
				height: 100vh;
				overflow: hidden;
				background: #0b1120;
			}

			.topbar {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				justify-content: space-between;
				gap: 8px 12px;
				flex-shrink: 0;
				width: 100%;
				max-width: 100%;
				padding: 8px 12px;
				background: rgba(17, 24, 39, 0.96);
				border-bottom: 1px solid var(--border);
				font-size: 13px;
			}

			.brand {
				display: flex;
				align-items: center;
				gap: 8px;
				min-width: 0;
				font-weight: 600;
				letter-spacing: 0.02em;
			}

			#nve-brand-title {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.brand-dot {
				width: 8px;
				height: 8px;
				border-radius: 999px;
				background: var(--accent);
				box-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
			}

			.topbar-right {
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.app-switcher {
				display: inline-flex;
				align-items: center;
				gap: 4px;
				padding: 2px;
				border-radius: 999px;
				border: 1px solid var(--border);
				background: #0b1120;
			}

			.app-tab {
				padding: 3px 10px;
				border-radius: 999px;
				color: var(--muted);
				text-decoration: none;
				font-size: 12px;
				font-weight: 500;
				transition:
					color 0.15s ease,
					background 0.15s ease;
			}

			.app-tab:hover {
				color: var(--text);
			}

			.app-tab[data-active="true"] {
				background: rgba(56, 189, 248, 0.16);
				color: var(--accent);
			}

			.status-pill {
				padding: 4px 10px;
				border-radius: 999px;
				border: 1px solid var(--border);
				background: #0b1120;
				color: var(--muted);
				font-size: 12px;
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
			}

			.status-pill[data-state="connected"],
			.status-pill[data-state="patched"] {
				color: #86efac;
				border-color: rgba(34, 197, 94, 0.45);
			}

			.status-pill[data-state="reloading"],
			.status-pill[data-state="connecting"] {
				color: #fde68a;
				border-color: rgba(245, 158, 11, 0.45);
			}

			#app {
				flex: 1 1 0;
				width: 100%;
				max-width: 100%;
				min-width: 0;
				min-height: 0;
				overflow: hidden;
				background: #0b1120;
				display: flex;
				flex-direction: column;
			}

			.boot-fallback {
				margin: 24px;
				padding: 20px;
				border-radius: 12px;
				border: 1px solid var(--border);
				background: var(--surface);
				color: var(--muted);
				line-height: 1.5;
			}

			.boot-fallback code {
				color: var(--accent);
			}
		</style>
	</head>
	<body>
		<div class="shell">
			<header class="topbar">
				<div class="brand">
					<span class="brand-dot"></span>
					<span id="nve-brand-title">Aether Workspace + NVE Studio · Web WASM</span>
				</div>
				<div class="topbar-right">
					<nav class="app-switcher" aria-label="NVE Web Demo App">
						<a id="tab-studio" class="app-tab" href="?app=studio" data-active="true">Studio</a>
						<a id="tab-counter" class="app-tab" href="?app=counter" data-active="false">Counter</a>
					</nav>
					<div id="nve-status" class="status-pill" data-state="booting">Booting WASM…</div>
				</div>
			</header>
			<main id="app">
				<div class="boot-fallback">Loading <code>./pkg/nve_web_shell.js</code>…</div>
			</main>
		</div>

		<script type="module">
			const statusEl = document.getElementById("nve-status");
			const appEl = document.getElementById("app");
			const brandTitleEl = document.getElementById("nve-brand-title");
			const tabStudio = document.getElementById("tab-studio");
			const tabCounter = document.getElementById("tab-counter");

			const params = new URLSearchParams(window.location.search);
			const appParam = (params.get("app") || "studio").trim().toLowerCase();
			const isCounter = appParam === "counter";
			const wsParam = params.get("ws");
			const hotReloadWsUrl = wsParam === "off" || wsParam === "none" ? null : wsParam || `ws://${window.location.hostname}:8089`;

			// Preserve any `?ws=...` setting when switching apps via the topbar links.
			const buildAppHref = (appName) => {
				const next = new URLSearchParams(window.location.search);
				if (appName === "studio") {
					next.delete("app");
				} else {
					next.set("app", appName);
				}
				const qs = next.toString();
				return qs ? `?${qs}` : window.location.pathname;
			};

			if (tabStudio) {
				tabStudio.href = buildAppHref("studio");
				tabStudio.dataset.active = String(!isCounter);
			}
			if (tabCounter) {
				tabCounter.href = buildAppHref("counter");
				tabCounter.dataset.active = String(isCounter);
			}
			if (isCounter) {
				document.title = "Counter · Native View Engine Web WASM";
				if (brandTitleEl) {
					brandTitleEl.textContent = "Native View Engine · Counter (Web WASM)";
				}
			}

			async function boot() {
				try {
					const bust = Date.now();
					const wasmMod = await import(`./pkg/nve_web_shell.js?v=${bust}`);
					await wasmMod.default(new URL(`./pkg/nve_web_shell_bg.wasm?v=${bust}`, window.location.href));
					const controller = isCounter
						? wasmMod.start_counter_app("app", hotReloadWsUrl)
						: wasmMod.start_studio_workspace_app("app", hotReloadWsUrl);
					window.__nveController = controller;
				} catch (err) {
					console.error("[NVE Web] Boot failed:", err);
					if (statusEl) {
						statusEl.textContent = "Boot error";
						statusEl.dataset.state = "offline";
					}
					if (appEl) {
						appEl.innerHTML = `
              <div class="boot-fallback">
                <strong>Failed to load NVE Web WASM bundle.</strong><br />
                Run <code>./hosts/web-shell/build.sh</code> from the repository root, then serve
                <code>hosts/web-shell</code> over HTTP.<br /><br />
                <code>${String(err)}</code>
              </div>
            `;
					}
				}
			}

			boot();
		</script>
	</body>
</html>
