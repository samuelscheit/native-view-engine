# Matches strictly test-only Rust outer attributes:
#   - `#[cfg(test)]` and `#[cfg(all(..., test, ...))]` (via `rust-cfg-test-attribute`)
#   - `#[test]`, `#[::tokio::test]`, `#[::core::prelude::v1::test]`, `#[wasm_bindgen_test]`, etc.

id: rust-test-attr
language: rust
rule:
  kind: attribute_item
  any:
    - has:
        matches: rust-cfg-test-attribute
    - regex: '^#\[\s*(?:::)?(?:[a-zA-Z0-9_]+::)*(?:test|wasm_bindgen_test)(?:\s*\([^)]*\))?\s*\]$'
