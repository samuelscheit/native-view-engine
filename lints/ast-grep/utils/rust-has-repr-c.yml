# Matches a Rust item whose preceding outer attribute chain includes `#[repr(..., C, ...)]`
# (including compound reprs with nested parens such as `#[repr(C, align(64))]` or `#[repr(align(64), C)]`).

id: rust-has-repr-c
language: rust
rule:
  follows:
    kind: attribute_item
    has:
      kind: attribute
      all:
        - has:
            kind: identifier
            regex: '^repr$'
        - has:
            field: arguments
            kind: token_tree
            has:
              kind: identifier
              regex: '^C$'
    stopBy:
      not:
        any:
          - kind: attribute_item
          - kind: line_comment
          - kind: block_comment
