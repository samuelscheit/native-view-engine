# [INV:no-legacy-nodestore-symbols]
# Polyglot legacy NodeStore-era host/component symbol bans (synced with `nve-arch-invariants`):
# `NVE_HOST_CLASS_*`, `ComponentKind`, `RenderSink`, `RawPropValue`, `RawStyleProps`,
# `NativeViewSpec`, `BatchSink`, `ExtensionUpdate`, `SetRawProp`, `ErasedExtension`.

id: no-legacy-nodestore-symbols-rust
language: rust
severity: error
message: "Legacy NodeStore symbol is banned; migrate to typed NodeStore tables/handles."
note: "Synced with `BANNED_LEGACY_SYMBOLS_NODESTORE` in `arch_invariants`."
ignores:
  - "packages/tools/arch-invariants/**"
  - "**/tests/**"
  - "**/benches/**"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/tests_*.rs"
  - "**/test.rs"
  - "**/*.generated.*"
rule:
  any:
    - kind: identifier
    - kind: type_identifier
  regex: '^(?:NVE_HOST_CLASS_.*|ComponentKind|RenderSink|RawPropValue|RawStyleProps|NativeViewSpec|BatchSink|ExtensionUpdate|SetRawProp|ErasedExtension)$'
  not:
    matches: rust-in-test-code
---
id: no-legacy-nodestore-symbols-cpp
