# Polyglot legacy NodeStore-era host/component symbol bans (`NVE_HOST_CLASS_*`, `ComponentKind`, `RenderSink`).
# Rust stays `warning` (`[stage: PostNodeStore]`) while pre-migration code exists on `main`;
# foreign hosts already have 0 violations on `main` and enforce `error` immediately.

id: no-legacy-nodestore-symbols-rust
language: rust
severity: warning
message: "Legacy NodeStore symbol is banned [stage: PostNodeStore]; migrate to typed NodeStore tables/handles."
note: "[stage: PostNodeStore] Bans `NVE_HOST_CLASS_*`, `ComponentKind`, and `RenderSink` in production Rust code. Flip to `error` once NodeStore lands."
ignores:
  - "packages/tools/cli/tests/arch_invariants/**"
  - "**/tests/**"
  - "**/benches/**"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/*.generated.*"
rule:
  any:
    - kind: identifier
    - kind: type_identifier
  regex: '^(?:NVE_HOST_CLASS_.*|ComponentKind|RenderSink)$'
  not:
    matches: rust-in-test-code
---
id: no-legacy-nodestore-symbols-cpp
language: cpp
severity: error
message: "Legacy NodeStore symbol is banned [stage: PostNodeStore]; migrate to typed NodeStore ABI handles."
note: "[stage: PostNodeStore] Bans `NVE_HOST_CLASS_*`, `ComponentKind`, and `RenderSink` in C++ hosts/bridges. Enforced as `error` immediately because `main` has 0 violations."
ignores:
  - "**/*.generated.*"
  - "**/tests/**"
  - "**/bench/**"
rule:
  any:
    - kind: identifier
    - kind: type_identifier
    - kind: field_identifier
  regex: '^(?:NVE_HOST_CLASS_.*|ComponentKind|RenderSink)$'
---
