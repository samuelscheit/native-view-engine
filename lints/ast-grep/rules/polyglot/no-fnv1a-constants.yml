# Polyglot FNV-1a magic constant bans (32-bit and 64-bit hex + decimal offset basis & prime).
# Standardize on `const fn xxh64` (`nve-hash` / `nve-abi`).
#
# Constants banned:
#   32-bit: 0x811c9dc5 (2166136261), 0x01000193 (16777619)
#   64-bit: 0xcbf29ce484222325 (14695981039346656037), 0x00000100000001b3 / 0x100000001b3 (1099511628211)

id: no-fnv1a-constants-rust
language: rust
severity: warning
message: "FNV-1a magic constant is banned [stage: PostNodeStore]; standardize on `const fn xxh64` (`nve-hash` / `nve-abi`)."
note: "[stage: PostNodeStore] Matches 32-bit and 64-bit hex/decimal FNV-1a constants. Flip to `error` when NodeStore/nve-hash lands."
ignores:
  - "packages/tools/cli/tests/arch_invariants/**"
  - "**/tests/**"
  - "**/benches/**"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/tests_*.rs"
  - "**/test.rs"
  - "**/*.generated.*"
rule:
  kind: integer_literal
  regex: '(?i)^(?:0x_*(?:(?:0_*)*8_*1_*1_*c_*9_*d_*c_*5|(?:0_*)*1_*0_*0_*0_*1_*9_*3|(?:0_*)*c_*b_*f_*2_*9_*c_*e_*4_*8_*4_*2_*2_*2_*3_*2_*5|(?:0_*)*1_*0_*0_*0_*0_*0_*0_*0_*1_*b_*3)|2_*1_*6_*6_*1_*3_*6_*2_*6_*1|1_*6_*7_*7_*7_*6_*1_*9|1_*4_*6_*9_*5_*9_*8_*1_*0_*3_*9_*3_*4_*6_*6_*5_*6_*0_*3_*7|1_*0_*9_*9_*5_*1_*1_*6_*2_*8_*2_*1_*1)_*(?:u32|u64|u128|usize|i32|i64|i128|isize)?$'
  not:
    matches: rust-in-test-code
---
id: no-fnv1a-constants-cpp
