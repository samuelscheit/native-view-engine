# Polyglot legacy Track 1B-1d event/style symbol bans (`NativeEventKind`, `NveEventPayloadTag`, `EventPayload`, `StylePatch`).
# Rust and Dart stay `warning` (`[stage: Post1B1D]`) while pre-migration code exists on `main`;
# C++, TypeScript, Swift, and Kotlin already have 0 violations on `main` and enforce `error` immediately.

id: no-legacy-event-style-symbols-rust
language: rust
severity: warning
message: "Legacy event/style symbol is banned [stage: Post1B1D]; migrate to canonical `NveEvent` / typed style tables."
note: "[stage: Post1B1D] Bans `NativeEventKind`, `NveEventPayloadTag`, `EventPayload`, and `StylePatch` in production Rust code. Flip to `error` once Track 1B-1d lands."
ignores:
  - "packages/tools/cli/tests/arch_invariants/**"
  - "**/tests/**"
  - "**/benches/**"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/*.generated.*"
rule:
  any:
    - kind: identifier
    - kind: type_identifier
  regex: '^(?:NativeEventKind|NveEventPayloadTag|EventPayload|StylePatch)$'
  not:
    matches: rust-in-test-code
---
id: no-legacy-event-style-symbols-cpp
language: cpp
severity: error
message: "Legacy event/style symbol is banned [stage: Post1B1D]; migrate to canonical `NveEvent` / typed style tables."
note: "[stage: Post1B1D] Bans `NativeEventKind`, `NveEventPayloadTag`, `EventPayload`, and `StylePatch` in C++ hosts/bridges. Enforced as `error` immediately because `main` has 0 violations."
ignores:
  - "**/*.generated.*"
  - "**/tests/**"
  - "**/bench/**"
rule:
  any:
    - kind: identifier
    - kind: type_identifier
    - kind: field_identifier
  regex: '^(?:NativeEventKind|NveEventPayloadTag|EventPayload|StylePatch)$'
---
