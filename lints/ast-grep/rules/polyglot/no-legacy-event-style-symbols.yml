# Polyglot legacy Track 1B-1d event/style symbol bans (synced with `arch_invariants/types_abi_and_regressions.rs`):
# `NativeEventKind`, `NveEventPayloadTag`, `EventPayload`, `EventMask`,
# `NveDirectEvent`, `TypedTableEvent`, `StylePatch`.

id: no-legacy-event-style-symbols-rust
language: rust
severity: warning
message: "Legacy event/style symbol is banned [stage: Post1B1D]; migrate to canonical `NveEvent` / typed style tables."
note: "[stage: Post1B1D] Synced with `BANNED_LEGACY_SYMBOLS_1B1D` in `arch_invariants`. Flip to `error` once Track 1B-1d lands."
ignores:
  - "packages/tools/arch-invariants/**"
  - "**/tests/**"
  - "**/benches/**"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/tests_*.rs"
  - "**/test.rs"
  - "**/*.generated.*"
rule:
  any:
    - kind: identifier
    - kind: type_identifier
  regex: '^(?:NativeEventKind|NveEventPayloadTag|EventPayload|EventMask|NveDirectEvent|TypedTableEvent|StylePatch)$'
  not:
    matches: rust-in-test-code
---
id: no-legacy-event-style-symbols-cpp
language: cpp
severity: warning
message: "Legacy event/style symbol is banned [stage: Post1B1D]; migrate to canonical `NveEvent` / typed style tables."
note: "[stage: Post1B1D] Includes `namespace_identifier` scopes and exempts React Native Fabric's `facebook::react::EventPayload` / `react::EventPayload`. Staged as `warning` while Apple/C++ hosts still reference `NveDirectEvent`."
ignores:
  - "**/*.generated.*"
  - "**/tests/**"
  - "**/bench/**"
  - "**/benches/**"
rule:
  any:
    - kind: identifier
    - kind: type_identifier
    - kind: field_identifier
    - kind: namespace_identifier
  regex: '^(?:NativeEventKind|NveEventPayloadTag|EventPayload|EventMask|NveDirectEvent|TypedTableEvent|StylePatch)$'
  not:
    all:
      - regex: '^EventPayload$'
      - any:
          - inside:
              stopBy: neighbor
              kind: qualified_identifier
              has:
                field: scope
                kind: namespace_identifier
                regex: '^react$'
          - inside:
              stopBy: end
              kind: namespace_definition
              has:
                field: name
                regex: '(?:^|::)react$'
---
