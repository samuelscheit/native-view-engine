id: rust-no-word-enum-macro
language: rust
severity: warning
message: "Legacy manual-bit-width `word_enum!` macro is banned [stage: Post1B1D]; use `#[derive(WordEnum)]`."
note: "[stage: Post1B1D] Staged as `warning` until Track 1B-1d replaces `word_enum!` with `#[derive(WordEnum)]`."
files:
  - "packages/**/*.rs"
ignores:
  - "packages/tools/arch-invariants/**"
  - "**/tests/**"
  - "**/benches/**"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/tests_*.rs"
  - "**/test.rs"
rule:
  kind: macro_invocation
  has:
    field: macro
    any:
      - kind: identifier
        regex: '^word_enum$'
      - kind: scoped_identifier
        has:
          field: name
          kind: identifier
          regex: '^word_enum$'
  not:
    matches: rust-in-test-code
