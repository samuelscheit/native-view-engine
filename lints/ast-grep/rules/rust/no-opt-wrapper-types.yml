id: rust-no-opt-wrapper-types
language: rust
severity: warning
message: "Manual `Opt*` wrapper struct/enum in core components/tables/store/modules is banned [stage: Post1B1D]; use `Option<T>` / `Opt<T>` directly."
note: "[stage: Post1B1D] Synced with `enum_and_macro_hygiene.rs` scope (`components`, `tables`, `store`, `modules`). Staged as `warning` until Track 1B-1d replaces `Opt*` wrappers with `Option<T>`."
files:
  - "packages/core/components/**/*.rs"
  - "packages/core/tables/**/*.rs"
  - "packages/core/store/**/*.rs"
  - "packages/modules/**/*.rs"
ignores:
  - "**/tests/**"
  - "**/benches/**"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/tests_*.rs"
  - "**/test.rs"
rule:
  any:
    - kind: struct_item
    - kind: enum_item
  has:
    field: name
    kind: type_identifier
    regex: '^Opt[A-Z]'
  not:
    matches: rust-in-test-code
