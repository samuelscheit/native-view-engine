id: rust-no-manual-impl-word-value
language: rust
severity: warning
message: "Manual `impl WordValue` outside `packages/core/store/` is banned [stage: Post1B1D]; derive via `#[derive(WordEnum)]`, `word_flags!`, or `#[derive(NveTable)]`."
note: "[stage: Post1B1D] Staged as `warning` until Track 1B-1d macro upgrades replace remaining manual `impl WordValue`."
files:
  - "packages/**/*.rs"
ignores:
  - "packages/core/store/**"
  - "packages/tools/arch-invariants/**"
  - "**/tests/**"
  - "**/benches/**"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/tests_*.rs"
  - "**/test.rs"
rule:
  kind: impl_item
  has:
    field: trait
    any:
      - kind: type_identifier
        regex: '^WordValue$'
      - kind: scoped_type_identifier
        has:
          field: name
          kind: type_identifier
          regex: '^WordValue$'
      - kind: generic_type
        has:
          field: type
          any:
            - kind: type_identifier
              regex: '^WordValue$'
            - kind: scoped_type_identifier
              has:
                field: name
                kind: type_identifier
                regex: '^WordValue$'
  not:
    matches: rust-in-test-code
