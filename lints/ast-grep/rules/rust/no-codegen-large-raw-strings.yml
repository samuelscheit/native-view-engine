id: rust-no-codegen-large-raw-strings
language: rust
severity: warning
message: "Multi-line raw string literal (>= 8 lines) in `packages/core/codegen/src/` is banned [stage: Post1B1E]; move static target code to checked-in files or templates."
note: "[stage: Post1B1E] Flip to `error` once Track 1B-1e replaces inline raw template blocks."
files:
  - "packages/core/codegen/src/**/*.rs"
ignores:
  - "**/tests/**"
  - "**/benches/**"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/tests_*.rs"
  - "**/test.rs"
rule:
  kind: raw_string_literal
  regex: '(?:[^\n]*\n){7}'
  not:
    matches: rust-in-test-code
