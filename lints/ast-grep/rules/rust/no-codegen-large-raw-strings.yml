id: rust-no-codegen-large-raw-strings
language: rust
severity: error
message: "Multi-line raw string literal (>= 8 lines) in `packages/core/codegen/src/` is banned; move static target code to checked-in `templates/` (Askama) or `packages/core/host-*` runtimes."
note: "Permanently enforced since Track 1B-1e: emitters render static target code from Askama templates or static host runtimes, never inline raw blocks."
files:
  - "packages/core/codegen/src/**/*.rs"
ignores:
  - "**/tests/**"
  - "**/benches/**"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/tests_*.rs"
  - "**/test.rs"
rule:
  kind: raw_string_literal
  regex: '(?:[^\n]*\n){7}'
  not:
    matches: rust-in-test-code
