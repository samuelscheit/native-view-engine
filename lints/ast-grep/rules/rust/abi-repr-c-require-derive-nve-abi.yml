id: rust-abi-repr-c-require-derive-nve-abi
language: rust
severity: error
message: "`#[repr(C)]` POD struct/union in `packages/core/abi/` must derive `NveAbi`."
note: "Matches public `#[repr(C)]` structs and unions in `packages/core/abi/src/` missing `#[derive(..., NveAbi, ...)]`. Exempts `*Api` C function-pointer vtable structs (`NveSurfaceApi`, `NveLayoutApi`, `NveComponentApi`, `NveDevApi`, `NveHostApi`), which cannot derive `NveAbi` over `unsafe extern \"C\" fn` fields and are compile-time layout-asserted in `packages/core/abi/src/layout_asserts.rs`."
files:
  - "packages/core/abi/src/**/*.rs"
ignores:
  - "**/tests/**"
  - "**/benches/**"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/tests_*.rs"
  - "**/test.rs"
rule:
  any:
    - kind: struct_item
    - kind: union_item
  has:
    kind: visibility_modifier
    regex: '^pub$'
  all:
    - matches: rust-has-repr-c
    - not:
        matches: rust-has-derive-nve-abi
    - not:
        has:
          field: name
          kind: type_identifier
          regex: 'Api$'
    - not:
        matches: rust-in-test-code
