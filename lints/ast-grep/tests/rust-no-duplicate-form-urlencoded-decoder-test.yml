id: rust-no-duplicate-form-urlencoded-decoder
valid:
  - |
    fn sign(b: u8) -> bool {
        match b {
            b'+' => true,
            _ => false,
        }
    }
  - |
    fn sign_digit(b: Option<u8>) -> (bool, usize) {
        match b {
            Some(b'+') => (false, 1),
            _ => (false, 0),
        }
    }
  - |
    fn op(c: char) -> Op {
        match c {
            '+' => Op::Add,
            _ => Op::Other,
        }
    }
  - |
    fn signed(b: u8, sign: &mut i32) {
        if b == b'+' {
            *sign = 1;
        }
    }
  - |
    fn encode(s: &str) -> String {
        s.replace(' ', "+").replace('+', "-")
    }
invalid:
  - |
    fn decode(bytes: &[u8], out: &mut Vec<u8>, i: usize) {
        match bytes[i] {
            b'+' => {
                out.push(b' ');
            }
            b => out.push(b),
        }
    }
  - |
    fn map(b: u8) -> u8 {
        match b {
            b'+' => b' ',
            b => b,
        }
    }
  - |
    fn map_char(c: char) -> char {
        match c {
            '+' => ' ',
            c => c,
        }
    }
  - |
    fn decode_if(bytes: &[u8], out: &mut Vec<u8>) {
        for &b in bytes {
            if b == b'+' {
                out.push(b' ');
            } else {
                out.push(b);
            }
        }
    }
  - |
    fn decode_str(s: &str) -> String {
        s.replace('+', " ")
    }
  - |
    fn decode_str_lit(s: &str) -> String {
        s.replace("+", " ").trim().to_owned()
    }
