        pub children: Vec<NodeId>,
    }
  - |
    pub struct NodeRow {
        pub label: String,
    }
  - |
    pub struct NodeRecord {
        pub extra: Option<Box<ColdData>>,
    }
  - |
    pub struct NodeData {
