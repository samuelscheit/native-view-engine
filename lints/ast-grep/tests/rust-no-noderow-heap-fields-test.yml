id: rust-no-noderow-heap-fields
valid:
  - |
    #[repr(C)]
    pub struct NodeRow {
        pub parent: NodeId,
        pub first_child: NodeId,
        pub next_sibling: NodeId,
        pub flags: u32,
    }
  - |
    pub struct NodeRow(pub NodeId, pub u32);
  - |
    pub struct NodeRow {
        pub _marker: core::marker::PhantomData<Vec<u8>>,
        pub _marker2: PhantomData<String>,
        pub raw_const: *const Vec<u8>,
        pub raw_mut: *mut String,
        pub maybe_ptr: Option<*const Box<u8>>,
    }
  - |
    pub struct OtherRow {
        pub children: Vec<NodeId>,
        pub name: String,
    }
  - |
    #[cfg(test)]
    mod tests {
        struct NodeRow {
            children: Vec<u32>,
            label: String,
        }
    }
  - |
    #[cfg(test)]
    struct NodeRow {
        boxed: Box<u32>,
    }
invalid:
