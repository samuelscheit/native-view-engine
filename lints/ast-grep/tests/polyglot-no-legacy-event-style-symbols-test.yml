id: no-legacy-event-style-symbols-rust
valid:
  - |
    pub struct NveEvent;
    pub struct NveEventPayload;
  - |
    // NativeEventKind, StylePatch in comments are ignored.
    const MSG: &str = "NveEventPayloadTag EventPayload";
  - |
    #[cfg(test)]
    mod tests {
        fn check(_k: NativeEventKind, _p: EventPayload, _s: StylePatch, _m: EventMask) {
            let _ = NveEventPayloadTag::Point;
        }
    }
invalid:
  - |
    pub fn on_event(kind: NativeEventKind) {}
  - |
    pub fn tag() -> NveEventPayloadTag { todo!() }
  - |
    pub fn handle(payload: EventPayload) {}
  - |
    pub fn apply(patch: &StylePatch) {}
  - |
    pub fn direct(mask: EventMask, ev: NveDirectEvent, t: TypedTableEvent) {}
  - |
    #[cfg(test)]
    mod tests {}

    pub fn leaked(patch: StylePatch) {}
  - |
    #[cfg(any(target_arch = "wasm32", test))]
    pub fn wasm_event(ev: EventPayload) {}
---
id: no-legacy-event-style-symbols-cpp
valid:
  - |
    struct NveEvent {};
    struct NveEventPayload {};
    // NativeEventKind in comment
  - |
    void dispatch(const facebook::react::EventPayload& payload);
  - |
    void dispatchShort(react::EventPayload payload);
  - |
    using facebook::react::EventPayload;
  - |
    namespace facebook::react {
        struct EventPayload {};
    }
invalid:
  - |
    auto k = NativeEventKind::Press;
  - |
    auto t = NveEventPayloadTag::Point;
  - |
    EventPayload payload;
  - |
    nve::EventPayload payload;
  - |
    StylePatch patch;
  - |
    NveDirectEvent ev{};
---
id: no-legacy-event-style-symbols-c
valid:
  - |
    struct NveEvent { int kind; };
invalid:
  - |
    struct NveDirectEvent ev;
  - |
    typedef int NativeEventKind;
---
id: no-legacy-event-style-symbols-typescript
valid:
  - |
    interface NveEvent { kind: number }
    interface NveEventPayload { x: number }
    // StylePatch in comment
invalid:
  - |
    type K = NativeEventKind;
  - |
    type T = NveEventPayloadTag;
  - |
    type P = EventPayload;
  - |
    type S = StylePatch;
  - |
    const obj = { StylePatch };
  - |
    const { EventPayload } = ev;
