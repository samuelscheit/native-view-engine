id: no-legacy-event-style-symbols-rust
valid:
  - |
    pub struct NveEvent;
    pub struct NveEventPayload;
  - |
    // NativeEventKind, StylePatch in comments are ignored.
    const MSG: &str = "NveEventPayloadTag EventPayload";
  - |
    #[cfg(test)]
    mod tests {
        fn check(_k: NativeEventKind, _p: EventPayload, _s: StylePatch) {
            let _ = NveEventPayloadTag::Point;
        }
    }
invalid:
  - |
    pub fn on_event(kind: NativeEventKind) {}
  - |
    pub fn tag() -> NveEventPayloadTag { todo!() }
  - |
    pub fn handle(payload: EventPayload) {}
  - |
    pub fn apply(patch: &StylePatch) {}
  - |
    #[cfg(test)]
    mod tests {}

    pub fn leaked(patch: StylePatch) {}
---
id: no-legacy-event-style-symbols-cpp
valid:
  - |
    struct NveEvent {};
    struct NveEventPayload {};
    // NativeEventKind in comment
invalid:
  - |
    NativeEventKind kind;
  - |
    NveEventPayloadTag tag;
  - |
    EventPayload payload;
  - |
    StylePatch patch;
