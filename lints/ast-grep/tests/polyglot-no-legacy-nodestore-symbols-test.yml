id: no-legacy-nodestore-symbols-rust
valid:
  - |
    pub struct NodeStore;
    pub struct MyComponentKind;
  - |
    // ComponentKind, RenderSink, RawPropValue in comments are ignored.
    const MSG: &str = "NVE_HOST_CLASS_VIEW";
  - |
    #[cfg(test)]
    mod tests {
        fn check(_k: ComponentKind, _s: &dyn RenderSink, _p: RawPropValue) {
            let _ = NVE_HOST_CLASS_VIEW;
        }
    }
  - |
    #[test]
    fn test_legacy() {
        let _ = ComponentKind::View;
    }
invalid:
  - |
    pub fn classify(kind: ComponentKind) {}
  - |
    pub fn flush<S: RenderSink>(sink: &mut S) {}
  - |
    pub const VIEW: u32 = NVE_HOST_CLASS_VIEW;
  - |
    pub fn prop(v: RawPropValue, s: RawStyleProps, spec: NativeViewSpec) {}
  - |
    pub fn ext(b: BatchSink, u: ExtensionUpdate, e: &dyn ErasedExtension) {
        let _ = Opcode::SetRawProp;
    }
  - |
    #[cfg(test)]
    mod tests {}

    pub fn leaked(kind: ComponentKind) {}
  - |
    #[cfg(any(target_arch = "wasm32", test))]
    pub fn wasm_or_test<S: RenderSink>(s: &mut S) {}
---
