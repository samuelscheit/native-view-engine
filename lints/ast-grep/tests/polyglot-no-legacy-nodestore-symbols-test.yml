id: no-legacy-nodestore-symbols-rust
valid:
  - |
    pub struct NodeStore;
    pub struct MyComponentKind;
  - |
    // ComponentKind and RenderSink in comments are ignored.
    const MSG: &str = "NVE_HOST_CLASS_VIEW";
  - |
    #[cfg(test)]
    mod tests {
        fn check(_k: ComponentKind, _s: &dyn RenderSink) {
            let _ = NVE_HOST_CLASS_VIEW;
        }
    }
  - |
    #[test]
    fn test_legacy() {
        let _ = ComponentKind::View;
    }
invalid:
  - |
    pub fn classify(kind: ComponentKind) {}
  - |
    pub fn flush<S: RenderSink>(sink: &mut S) {}
  - |
    pub const VIEW: u32 = NVE_HOST_CLASS_VIEW;
  - |
    #[cfg(test)]
    mod tests {}

    pub fn leaked(kind: ComponentKind) {}
  - |
    #[cfg(not(test))]
    pub fn prod_only<S: RenderSink>(s: &mut S) {}
---
id: no-legacy-nodestore-symbols-cpp
valid:
