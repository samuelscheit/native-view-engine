id: rust-no-private-byte-reader-writer
valid:
  - |
    pub struct ByteReader<'a>(&'a [u8]);
  - |
    pub struct ByteWriter(Vec<u8>);
  - |
    struct FrameReader<'a>(&'a [u8]);
  - |
    #[cfg(test)]
    mod tests {
        struct ByteReader<'a>(&'a [u8]);
        struct ByteWriter(Vec<u8>);
    }
  - |
    #[cfg(test)]
    struct ByteReader<'a>(&'a [u8]);
invalid:
  - |
    struct ByteReader<'a>(&'a [u8]);
  - |
    struct ByteWriter {
        buf: Vec<u8>,
    }
  - |
    pub(crate) struct ByteReader<'a> {
        data: &'a [u8],
    }
  - |
    pub(super) struct ByteWriter(Vec<u8>);
  - |
    #[cfg(test)]
    mod tests {}

    struct ByteReader<'a>(&'a [u8]);
  - |
    #[cfg(not(test))]
    struct ByteWriter(Vec<u8>);
---
id: rust-no-private-legacy-byte-readers
valid:
  - |
    pub struct BinReader<'a>(&'a [u8]);
    impl<'a> BinReader<'a> {
        pub fn read_u32(&mut self) -> u32 { 0 }
    }
  - |
    // Text/JSX parser Cursor without binary integer decoding is NOT a byte reader.
    struct Cursor<'a> {
        src: &'a str,
        pos: usize,
    }
    impl<'a> Cursor<'a> {
        fn peek(&self) -> Option<u8> { None }
    }
  - |
    #[cfg(test)]
    mod tests {
        struct WireReader<'a>(&'a [u8]);
        impl<'a> WireReader<'a> {
            fn read_u32(&mut self) -> u32 { u32::from_le_bytes([0; 4]) }
        }
    }
invalid:
  - |
    struct WireReader<'a> {
        buf: &'a [u8],
    }
    impl<'a> WireReader<'a> {
        fn read_u32(&mut self) -> u32 { 0 }
    }
  - |
    pub(crate) struct WireReader<'a>(&'a [u8]);
    fn decode(b: [u8; 2]) -> u16 { u16::from_le_bytes(b) }
  - |
    struct Cursor<'a> {
        buf: &'a [u8],
    }
    impl<'a> Cursor<'a> {
        fn read_u16(&mut self) -> u16 { u16::from_le_bytes([0; 2]) }
    }
  - |
    struct BinWriter(Vec<u8>);
    fn read_u32() -> u32 { 0 }
---
id: rust-no-private-slice-byte-readers
valid:
  - |
    pub fn read_u32(buf: &[u8]) -> u32 {
        u32::from_le_bytes([buf[0], buf[1], buf[2], buf[3]])
    }
  - |
    fn read_u32(r: &mut nve_codec::ByteReader<'_>) -> Result<u32, nve_codec::CodecError> {
        r.read_u32()
    }
  - |
    #[cfg(test)]
    mod tests {
        fn read_u32(buf: &[u8], pos: &mut usize) -> Option<u32> {
            let s = buf.get(*pos..*pos + 4)?;
            *pos += 4;
            Some(u32::from_le_bytes(s.try_into().ok()?))
        }
    }
invalid:
  - |
    fn read_u32(buf: &[u8], pos: &mut usize) -> Option<u32> {
        let s = buf.get(*pos..*pos + 4)?;
        *pos += 4;
        Some(u32::from_le_bytes(s.try_into().ok()?))
    }
  - |
    fn read_u64(buf: &[u8]) -> u64 {
        u64::from_le_bytes([buf[0], buf[1], buf[2], buf[3], buf[4], buf[5], buf[6], buf[7]])
    }
---
id: rust-no-swallowed-codec-write
valid:
  - |
    fn encode(w: &mut ByteWriter, s: &str) -> Result<(), CodecError> {
        w.write_str(s)?;
        w.write_len(1)?;
        Ok(())
    }
  - |
    fn format_text(out: &mut String) {
        let _ = writeln!(out, "ok");
    }
invalid:
  - |
    fn encode(w: &mut ByteWriter, s: &str) {
        let _ = w.write_str(s);
    }
  - |
    fn encode(w: &mut ByteWriter) {
        let _ = w.patch_u32(0, 42);
    }
