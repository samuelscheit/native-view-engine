[package]
name = "nve-docs-site"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["cdylib-export"]
cdylib-export = []

[dependencies]
nve-abi = { workspace = true }
nve-backend-web = { path = "../../crates/nve-backend-web", default-features = false, features = ["ssr", "hydrate"] }
nve-components = { workspace = true }
nve-dioxus = { workspace = true }
nve-docs = { workspace = true }
nve-engine = { workspace = true }
nve-interop = { path = "../../crates/nve-interop", default-features = false, features = ["crdt"] }
nve-mdx = { workspace = true }
nve-router = { workspace = true }
nve-sdk = { path = "../../crates/nve-sdk", default-features = false }
nve-ui = { path = "../../crates/nve-ui", default-features = false, features = ["virtual-list"] }
dioxus-core = { workspace = true }
dioxus-core-macro = { workspace = true }
dioxus-signals = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "History",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Performance",
    "Window",
    "console",
] }

[dev-dependencies]
nve-backend-headless = { workspace = true }
nve-backend-skia = { workspace = true }
