[package]
name = "nve-docs-site"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["cdylib-export"]
cdylib-export = []

[dependencies]
nve-abi = { workspace = true }
nve-backend-web = { version = "0.1.0", path = "../../packages/backends/web", default-features = false, features = ["ssr", "hydrate"] }
nve-canvas = { workspace = true }
nve-tables = { workspace = true }
nve-dioxus = { workspace = true }
nve-docs = { workspace = true }
nve-engine = { workspace = true }
nve-canvas-web = { workspace = true }
nve-store = { workspace = true }
nve-web-html = { workspace = true }
nve-web-html-web = { workspace = true }
nve-interop = { version = "0.1.0", path = "../../packages/core/interop", default-features = false, features = ["crdt"] }
nve-mdx = { workspace = true }
nve-router = { workspace = true }
nve-host-services = { workspace = true }
nve-clipboard = { workspace = true }
nve-system-env = { workspace = true }
nve-ui = { version = "0.1.0", path = "../../packages/framework/ui", default-features = false, features = ["virtual-list"] }
dioxus-core = { workspace = true }
dioxus-core-macro = { workspace = true }
dioxus-signals = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "History",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MouseEvent",
    "Performance",
    "Window",
    "console",
] }

[dev-dependencies]
nve-backend-headless = { workspace = true }
nve-backend-skia = { workspace = true }
nve-canvas-skia = { workspace = true }

[lints]
workspace = true
