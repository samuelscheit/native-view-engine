[package]
name = "nve-example-kitchen-sink"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nve_example_kitchen_sink"
# rlib for direct headless/CLI/WASM embedding + cdylib for Tier-2 hot-swap reloading!
crate-type = ["rlib", "cdylib"]

[features]
default = ["cdylib-export"]
cdylib-export = []
# The Kitchen Sink's web table plugins (`register_web_systems`) for every web host and prerenderer.
web = ["dep:nve-backend-web", "dep:nve-canvas-web", "dep:nve-web-html-web"]

[dependencies]
nve-backend-web = { workspace = true, optional = true }
nve-canvas-web = { workspace = true, optional = true }
nve-web-html-web = { workspace = true, optional = true }
nve-abi = { workspace = true }
nve-canvas = { workspace = true }
nve-tables = { workspace = true }
nve-engine = { workspace = true }
nve-dioxus = { workspace = true }
nve-store = { workspace = true }
nve-host-services = { workspace = true }
nve-interop = { workspace = true }
nve-motion = { workspace = true }
nve-ui = { workspace = true }
nve-system-env = { workspace = true }
nve-i18n = { workspace = true }
dioxus-core = { workspace = true }
dioxus-signals = { workspace = true }
dioxus-core-macro = { workspace = true }

[dev-dependencies]
nve-backend-headless = { workspace = true }
nve-backend-skia = { workspace = true }
nve-backend-web = { workspace = true }
nve-canvas-skia = { workspace = true }
nve-canvas-web = { workspace = true }
nve-web-html-web = { workspace = true }

[lints]
workspace = true
