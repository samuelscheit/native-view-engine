[workspace]
resolver = "2"
members = [
    "crates/nve-abi",
    "crates/nve-components",
    "crates/nve-engine",
    "crates/nve-layout-yoga",
    "crates/nve-dioxus",
    "crates/nve-codegen",
    "crates/nve-interop",
    "crates/nve-sdk",
    "crates/nve-ui",
    "crates/nve-router",
    "crates/nve-mdx",
    "crates/nve-docs",
    "crates/nve-backend-headless",
    "crates/nve-backend-skia",
    "crates/nve-backend-web",
    "crates/nve-cli",
    "crates/nve-bench",
    "examples/counter",
    "examples/studio-workspace",
    "examples/nve-docs-site",
    "hosts/skia-shell",
    "hosts/web-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
nve-abi = { path = "crates/nve-abi" }
nve-components = { path = "crates/nve-components" }
nve-engine = { path = "crates/nve-engine" }
nve-layout-yoga = { path = "crates/nve-layout-yoga" }
nve-dioxus = { path = "crates/nve-dioxus" }
nve-codegen = { path = "crates/nve-codegen" }
nve-interop = { path = "crates/nve-interop" }
nve-sdk = { path = "crates/nve-sdk" }
nve-ui = { path = "crates/nve-ui" }
nve-router = { path = "crates/nve-router" }
nve-mdx = { path = "crates/nve-mdx" }
nve-docs = { path = "crates/nve-docs" }
nve-backend-headless = { path = "crates/nve-backend-headless" }
nve-backend-skia = { path = "crates/nve-backend-skia" }
nve-backend-web = { path = "crates/nve-backend-web" }
nve-skia-shell = { path = "hosts/skia-shell" }
nve-example-counter = { path = "examples/counter" }
nve-studio-workspace = { path = "examples/studio-workspace", default-features = false }

dioxus-core = "0.7.10"
dioxus-signals = "0.7.10"
dioxus-core-macro = "0.7.10"
taffy = "0.16.0"
cc = "1.11"
libloading = "0.9.1"
clap = { version = "4.6.10", features = ["derive"] }
notify = "9.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = "0.30.0"
crossbeam-channel = "0.5.17"
skia-safe = "0.157.0"
cosmic-text = "0.19.0"
winit = "0.30.13"
softbuffer = "0.4.8"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["Document", "Element", "HtmlElement", "CssStyleDeclaration", "Window", "Text", "Node", "MouseEvent", "EventTarget", "Event", "WebSocket", "MessageEvent", "console"] }
criterion = "0.8.2"

# Fast incremental builds: keep workspace crates unoptimized while optimizing heavy deps once.
[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = 0

# Native release profile: cross-crate LTO with `panic = "unwind"` preserved so
# `export_nve_app!` FFI boundaries can isolate Rust panics via `catch_unwind`.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

# Size-optimized WASM profile for `hosts/web-shell` (driven by hosts/web-shell/build.sh, which adds
# nightly -Zbuild-std + -Cpanic=immediate-abort; see docs/research/wasm-size/toolchain.md).
# `strip = "debuginfo"`, not "symbols": wasm-ld's --strip-all also drops the `target_features`
# section, which makes wasm-bindgen fall back to the larger non-externref JS glue and makes
# wasm-opt reject the module (bulk-memory/nontrapping-fptoint are on by default since Rust 1.87).
# The name section is removed later by wasm-opt --strip-debug.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
