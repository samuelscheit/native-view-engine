[workspace]
resolver = "2"
members = [
    "packages/core/abi",
    "packages/core/abi-macros",
    "packages/core/components",
    "packages/core/engine",
    "packages/core/layout-yoga",
    "packages/core/dioxus",
    "packages/core/codegen",
    "packages/core/interop",
    "packages/core/host-services",
    "packages/backends/headless",
    "packages/backends/skia",
    "packages/backends/web",
    "packages/framework/ui",
    "packages/framework/router",
    "packages/framework/i18n",
    "packages/framework/mdx",
    "packages/framework/docs",
    "packages/tools/cli",
    "packages/tools/bench",
    "packages/modules/audio",
    "packages/modules/camera",
    "packages/modules/clipboard",
    "packages/modules/filesystem",
    "packages/modules/fonts",
    "packages/modules/haptics",
    "packages/modules/linking",
    "packages/modules/location",
    "packages/modules/notifications",
    "packages/modules/pair",
    "packages/modules/secure-store",
    "packages/modules/sensors",
    "packages/modules/share",
    "packages/modules/storage",
    "packages/modules/system-env",
    "packages/modules/tv",
    "packages/modules/web-auth",
    "examples/counter",
    "examples/studio-workspace",
    "examples/nve-docs-site",
    "hosts/skia-shell",
    "hosts/web-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
nve-abi = { path = "packages/core/abi" }
nve-abi-macros = { path = "packages/core/abi-macros" }
nve-components = { path = "packages/core/components" }
nve-engine = { path = "packages/core/engine" }
nve-layout-yoga = { path = "packages/core/layout-yoga" }
nve-dioxus = { path = "packages/core/dioxus" }
nve-codegen = { path = "packages/core/codegen" }
nve-interop = { path = "packages/core/interop" }
nve-host-services = { path = "packages/core/host-services" }
nve-ui = { path = "packages/framework/ui" }
nve-router = { path = "packages/framework/router" }
nve-i18n = { path = "packages/framework/i18n" }
nve-mdx = { path = "packages/framework/mdx" }
nve-docs = { path = "packages/framework/docs" }
nve-backend-headless = { path = "packages/backends/headless" }
nve-backend-skia = { path = "packages/backends/skia" }
nve-backend-web = { path = "packages/backends/web" }
nve-clipboard = { path = "packages/modules/clipboard" }
nve-filesystem = { path = "packages/modules/filesystem" }
nve-secure-store = { path = "packages/modules/secure-store" }
nve-linking = { path = "packages/modules/linking" }
nve-system-env = { path = "packages/modules/system-env" }
nve-notifications = { path = "packages/modules/notifications" }
nve-haptics = { path = "packages/modules/haptics" }
nve-skia-shell = { path = "hosts/skia-shell" }
nve-example-counter = { path = "examples/counter" }
nve-studio-workspace = { path = "examples/studio-workspace", default-features = false }

dioxus-core = "0.7.10"
dioxus-signals = "0.7.10"
dioxus-core-macro = "0.7.10"
taffy = "0.16.0"
cc = "1.11"
libloading = "0.9.1"
clap = { version = "4.6.10", features = ["derive"] }
notify = "9.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rustc-hash = "2.1.1"
tungstenite = "0.30.0"
crossbeam-channel = "0.5.17"
skia-safe = "0.157.0"
cosmic-text = "0.19.0"
winit = "0.30.13"
softbuffer = "0.4.8"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["Document", "Element", "HtmlElement", "CssStyleDeclaration", "Window", "Text", "Node", "MouseEvent", "EventTarget", "Event", "WebSocket", "MessageEvent", "console"] }
criterion = "0.8.2"

# Fast incremental builds: keep workspace crates unoptimized while optimizing heavy deps once.
[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = 0

# Native release profile: cross-crate LTO with `panic = "unwind"` preserved so
# `export_nve_app!` FFI boundaries can isolate Rust panics via `catch_unwind`.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

# Size-optimized WASM profile for `hosts/web-shell` (driven by hosts/web-shell/build.sh, which adds
# nightly -Zbuild-std + -Cpanic=immediate-abort; see docs/research/wasm-size/toolchain.md).
# `strip = "debuginfo"`, not "symbols": wasm-ld's --strip-all also drops the `target_features`
# section, which makes wasm-bindgen fall back to the larger non-externref JS glue and makes
# wasm-opt reject the module (bulk-memory/nontrapping-fptoint are on by default since Rust 1.87).
# The name section is removed later by wasm-opt --strip-debug.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Dioxus 0.7.10 + three wasm-size fixes (upstream PR candidates), see docs/UPSTREAM.md "Dioxus":
# anyhow without `std`, FxHashSet subscriber sets, subsecond's wasm32 loader behind `wasm-patching`.
# Every crate of the dioxus workspace that we link is patched so `cargo tree -d` shows one copy.
[patch.crates-io]
dioxus-core = { git = "https://github.com/samuelscheit/dioxus", rev = "e617997a169b9c5f77cea932ec75201cc28d40c9" }
dioxus-core-macro = { git = "https://github.com/samuelscheit/dioxus", rev = "e617997a169b9c5f77cea932ec75201cc28d40c9" }
dioxus-core-types = { git = "https://github.com/samuelscheit/dioxus", rev = "e617997a169b9c5f77cea932ec75201cc28d40c9" }
dioxus-rsx = { git = "https://github.com/samuelscheit/dioxus", rev = "e617997a169b9c5f77cea932ec75201cc28d40c9" }
dioxus-signals = { git = "https://github.com/samuelscheit/dioxus", rev = "e617997a169b9c5f77cea932ec75201cc28d40c9" }
generational-box = { git = "https://github.com/samuelscheit/dioxus", rev = "e617997a169b9c5f77cea932ec75201cc28d40c9" }
subsecond = { git = "https://github.com/samuelscheit/dioxus", rev = "e617997a169b9c5f77cea932ec75201cc28d40c9" }
subsecond-types = { git = "https://github.com/samuelscheit/dioxus", rev = "e617997a169b9c5f77cea932ec75201cc28d40c9" }
