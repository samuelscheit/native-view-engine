[package]
name = "nve-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nve"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
crossbeam-channel = { workspace = true }
notify = { workspace = true }
serde_json = { workspace = true }
tungstenite = { workspace = true }
nve-abi = { workspace = true }
nve-store = { workspace = true }
nve-components = { workspace = true }
nve-engine = { workspace = true }
nve-dioxus = { workspace = true }
dioxus-core = { workspace = true }
dioxus-signals = { workspace = true }
nve-codegen = { workspace = true }
nve-interop = { workspace = true }
nve-wire = { workspace = true }
nve-backend-headless = { workspace = true }
nve-backend-skia = { workspace = true }
nve-backend-web = { workspace = true }
nve-docs = { workspace = true }
nve-ui = { workspace = true }
nve-mdx = { workspace = true }
nve-docs-site = { version = "0.1.0", path = "../../../examples/nve-docs-site", default-features = false }
nve-example-kitchen-sink = { workspace = true, features = ["web"] }
nve-studio-workspace = { workspace = true, features = ["web"] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "rsx_diff_bench"
harness = false

[lints]
workspace = true
