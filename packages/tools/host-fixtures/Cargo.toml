[package]
name = "nve-host-fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-suite fixtures: real NVE2 scene frames (standard tables, resources, canvas draw lists) and an echo app module, both driven through libnve_runtime"

[lib]
name = "nve_host_fixture_app"
path = "src/echo_app.rs"
crate-type = ["cdylib"]

[[bin]]
name = "nve-host-fixtures"
path = "src/main.rs"

[dependencies]
nve-abi = { workspace = true }
nve-canvas = { workspace = true }
nve-tables = { workspace = true }
nve-engine = { workspace = true }
nve-store = { workspace = true }

[lints]
workspace = true
