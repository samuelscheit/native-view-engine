[package]
name = "nve-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Compile-time checked templates. No `config` feature: it pulls in the unmaintained `basic-toml`
# (RUSTSEC-2024-0442), and the defaults are what codegen needs (`templates/`, whitespace preserved);
# every `#[template]` sets `escape = "none"`, so no extension can HTML-escape generated code.
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
nve-abi = { workspace = true }
nve-hash = { workspace = true }
serde = { workspace = true }
# Hybrid `.rs` spec frontend (`frontend/hybrid_spec`).
proc-macro2 = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
# The real core `TableDesc`s for ABI tests and benches (the library takes any `&[&TableDesc]`).
nve-tables = { workspace = true }
# Round-trip tests of the `NveExportSpec` serde derives (JSON loading itself lives in `nve-cli`).
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "codegen_bench"
harness = false

[lints]
workspace = true
