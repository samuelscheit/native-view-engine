[package]
name = "nve-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nve-abi = { workspace = true }
nve-hash = { workspace = true }
# Core `#[derive(NveTable)]` descriptors for the Dart table-layout emitter.
nve-components = { workspace = true }
nve-store = { workspace = true }
serde = { workspace = true }
# Hybrid `.rs` spec frontend; `span-locations` gives parse errors real line/column numbers.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full"] }

[dev-dependencies]
# Round-trip tests of the `NveExportSpec` serde derives (JSON loading itself lives in `nve-cli`).
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "codegen_bench"
harness = false

[lints]
workspace = true
