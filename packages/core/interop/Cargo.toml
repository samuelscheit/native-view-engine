[package]
name = "nve-interop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = [
    "crdt",
    "traits",
    "window",
    "plugin-host",
    "gesture",
    "channel",
    "layout",
    "reconcile",
]
crdt = []
traits = []
window = []
plugin-host = []
gesture = []
channel = []
layout = []
reconcile = []

[dependencies]
nve-abi = { workspace = true }
nve-components = { workspace = true }
nve-engine = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
nve-store = { workspace = true }

[[test]]
name = "crdt_property_tests"
required-features = ["crdt"]

[[test]]
name = "traits_tests"
required-features = ["traits"]

[[test]]
name = "reconcile_crdt_tests"
required-features = ["reconcile", "crdt"]

[[test]]
name = "window_manager_tests"
required-features = ["window"]

[lints]
workspace = true
