[package]
name = "nve-host-services"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Binary NVE_IFACE_HOST = 5 host-service transport, FFI client, binary codec, and composable handler registry"

[dependencies]
nve-abi = { workspace = true }
nve-codec = { workspace = true }
nve-interop = { version = "0.1.0", path = "../interop", default-features = false, features = ["channel"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "host_services_bench"
harness = false

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "service_slots_bench"
harness = false

[lints]
workspace = true
