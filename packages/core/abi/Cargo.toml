[package]
name = "nve-abi"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["wire"]
wire = ["serde"]
serde = ["dep:serde"]

[dependencies]
nve-abi-macros = { workspace = true }
nve-codec = { workspace = true }
nve-hash = { workspace = true }
serde = { workspace = true, optional = true }
rustc-hash = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "abi_bench"
harness = false

[lints]
workspace = true
