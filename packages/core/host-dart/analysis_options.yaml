# Standalone analysis for `nve_host` (zero third-party lint packages, so rules are listed here).
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Hard error: JS numbers are exact only to 2^53; every 64-bit value travels as (lo, hi) u32 halves.
    avoid_js_rounded_ints: error

linter:
  rules:
    - avoid_js_rounded_ints
    - always_declare_return_types
    - annotate_overrides
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_relative_lib_imports
    - avoid_shadowing_type_parameters
    - avoid_types_as_parameter_names
    - camel_case_types
    - collection_methods_unrelated_type
    - curly_braces_in_flow_control_structures
    - empty_catches
    - empty_statements
    - exhaustive_cases
    - hash_and_equals
    - no_duplicate_case_values
    - non_constant_identifier_names
    - only_throw_errors
    - prefer_const_constructors
    - prefer_final_fields
    - prefer_final_locals
    - prefer_is_empty
    - prefer_is_not_empty
    - recursive_getters
    - test_types_in_equals
    - type_annotate_public_apis
    - unawaited_futures
    - unnecessary_new
    - unnecessary_this
    - unrelated_type_equality_checks
    - valid_regexps
