[package]
name = "nve-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Framework-agnostic host runtime for NVE: zero-copy NveSceneView publication, LaidOutScene orchestration, WakeBridge, FrameTickHook, and single-entry C ABI"

[lib]
name = "nve_runtime"
# `cdylib` for dynamically loaded hosts (Flutter `dart:ffi`, JNI); CMake builds the staticlib via
# `cargo rustc --crate-type staticlib`.
crate-type = ["rlib", "cdylib"]

[features]
default = ["wire"]
wire = ["dep:nve-wire"]

[dependencies]
nve-abi = { workspace = true }
nve-tables = { workspace = true }
nve-engine = { workspace = true }
nve-host-services = { workspace = true }
nve-layout = { workspace = true }
nve-store = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nve-wire = { workspace = true, features = ["client"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }
nve-wire = { workspace = true, features = ["client", "server"] }

[[bench]]
name = "runtime_tick_bench"
harness = false

[lints]
workspace = true
