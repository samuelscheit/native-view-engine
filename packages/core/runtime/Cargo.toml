[package]
name = "nve-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Framework-agnostic host runtime for NVE: zero-copy NveRuntimeSceneView publication, LaidOutScene orchestration, WakeBridge, FrameTickHook, and single-entry C ABI"

[lib]
name = "nve_runtime"
crate-type = ["rlib"]

[dependencies]
nve-abi = { workspace = true }
nve-components = { workspace = true }
nve-engine = { workspace = true }
nve-layout = { workspace = true }
nve-store = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "runtime_tick_bench"
harness = false

[lints]
workspace = true
