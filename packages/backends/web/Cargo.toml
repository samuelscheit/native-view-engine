[package]
name = "nve-backend-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["ssr", "hydrate"]
ssr = []
hydrate = ["ssr", "dep:nve-interop"]
# `select_parity::SELECT_BASE_CASES`: shared test / live-probe fixture, not runtime API.
parity-fixtures = ["hydrate"]

[dependencies]
nve-abi = { workspace = true }
nve-codec = { workspace = true }
nve-interop = { version = "0.1.0", path = "../../core/interop", default-features = false, features = ["reconcile"], optional = true }
nve-layout = { workspace = true }
nve-tables = { workspace = true }
nve-engine = { workspace = true }
nve-host-services = { workspace = true }
nve-store = { workspace = true }
base64 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "CompositionEvent",
    "CssStyleDeclaration",
    "CssStyleSheet",
    "DomRect",
    "FocusEvent",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlOptionElement",
    "HtmlSelectElement",
    "HtmlStyleElement",
    "HtmlTextAreaElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "NodeList",
    "Performance",
    "PointerEvent",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "ShadowRoot",
    "Storage",
    "SvgElement",
    "VisualViewport",
] }

[dev-dependencies]
nve-rpc = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "web_bench"
harness = false
required-features = ["ssr"]

[lints]
workspace = true
