[package]
name = "nve-backend-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["ssr", "hydrate"]
ssr = []
hydrate = []

[dependencies]
nve-abi = { workspace = true }
nve-codec = { workspace = true }
nve-components = { workspace = true }
nve-engine = { workspace = true }
nve-store = { workspace = true }
base64 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "CanvasRenderingContext2d",
    "CompositionEvent",
    "CssStyleSheet",
    "DomRect",
    "FocusEvent",
    "HtmlCanvasElement",
    "HtmlDialogElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlStyleElement",
    "HtmlTextAreaElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "KeyboardEvent",
    "Location",
    "NodeList",
    "Performance",
    "ShadowRoot",
    "Storage",
    "SvgElement",
    "VisualViewport",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "web_bench"
harness = false
required-features = ["ssr"]

[lints]
workspace = true
