[package]
name = "nve-i18n"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-first, wasm32-ready CLDR internationalization and localization for Native View Engine"

[features]
default = ["builtin-fallback"]
# Pure-Rust CLDR plural rules and number/currency/calendar/relative-time formatting tables.
# Disable on `wasm32` (`default-features = false`) to rely solely on browser `Intl.*`
# with zero bundled CLDR tables.
builtin-fallback = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "i18n_bench"
harness = false

[lints]
workspace = true
