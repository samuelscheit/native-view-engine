[package]
name = "nve-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["virtual-list"]
virtual-list = []
spatial-focus = ["dep:nve-tv"]

[dependencies]
nve-abi = { workspace = true }
nve-dioxus = { workspace = true }
nve-engine = { workspace = true }
nve-i18n = { workspace = true }
nve-interop = { version = "0.1.0", path = "../../core/interop", default-features = false }
nve-tv = { workspace = true, optional = true }
nve-web-html = { workspace = true }
base64 = { workspace = true }
dioxus-core = { workspace = true }
dioxus-core-macro = { workspace = true }
dioxus-signals = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Storage"] }

[dev-dependencies]
nve-backend-headless = { workspace = true }
nve-backend-web = { workspace = true }
nve-components = { workspace = true }
nve-rpc = { workspace = true }
nve-store = { workspace = true }
nve-web-html-web = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[test]]
name = "spatial_focus_tests"
required-features = ["spatial-focus"]

[[test]]
name = "virtual_list_perf_tests"
required-features = ["virtual-list"]

[[bench]]
name = "virtual_list_bench"
harness = false
required-features = ["virtual-list"]

[lints]
workspace = true

[[bench]]
name = "theme_bench"
harness = false
