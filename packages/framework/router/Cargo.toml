[package]
name = "nve-router"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nve-codec = { workspace = true }
nve-dioxus = { workspace = true }
nve-interop = { workspace = true }
dioxus-core = { workspace = true }
dioxus-core-macro = { workspace = true }
dioxus-signals = { workspace = true }

[dev-dependencies]
nve-abi = { workspace = true }
nve-backend-headless = { workspace = true }
nve-tables = { workspace = true }
nve-store = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Element", "Event", "EventTarget", "History", "Location", "PopStateEvent", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "router_bench"
harness = false

[lints]
workspace = true
