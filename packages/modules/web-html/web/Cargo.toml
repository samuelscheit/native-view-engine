[package]
name = "nve-web-html-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nve-backend-web = { workspace = true }
nve-tables = { workspace = true }
nve-store = { workspace = true }
nve-web-html = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["DomRect", "HtmlDialogElement", "MouseEvent"] }

[dev-dependencies]
nve-backend-web = { workspace = true, features = ["ssr"] }
nve-engine = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "web_html_web_bench"
harness = false

[lints]
workspace = true
