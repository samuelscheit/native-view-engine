[package]
name = "nve-camera"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional NVE VisionCamera v5 adapter, typed CameraPreview NativeViewSpec, 40B repr(C) CameraFrameWireLayout, and Nitro bridge bindings"

[features]
default = ["spec"]
spec = ["dep:nve-components"]
interop = ["spec", "dep:nve-interop"]
nitro = []
serde = ["dep:serde"]

[dependencies]
nve-components = { workspace = true, optional = true }
nve-interop = { path = "../../core/interop", optional = true, default-features = false, features = ["native-view"] }
serde = { workspace = true, optional = true }

[dev-dependencies]
nve-abi = { workspace = true }
