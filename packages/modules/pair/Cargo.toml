[workspace]

[package]
name = "nve-pair"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared zero-JSON NVT1/NVD1 pairing state machine and C ABI for NVE hosts"

[lib]
name = "nve_pair"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
nve-abi = { path = "../../../crates/nve-abi" }
nve-interop = { path = "../../../crates/nve-interop" }
