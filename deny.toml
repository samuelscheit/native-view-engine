# cargo-deny configuration for native-view-engine
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
ignore = [
    # Transitive via hax-lib-macros -> rind -> web-transport-quinn -> nve-wire; no safe upstream upgrade yet.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is pulled transitively via rind/web-transport-quinn with no safe upgrade available" },
    # Transitive via fontdb/cosmic-text (nve-backend-skia) and ab_glyph/sctk-adwaita/winit (nve-skia-shell); no safe upstream upgrade yet.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is pulled transitively via cosmic-text and winit/sctk-adwaita with no safe upgrade available" },
    # Transitive via accesskit_unix 0.24.1 -> accesskit_winit 0.34.2 (nve-skia-shell); zvariant*/zbus_names merged into zbus 6 with no upstream accesskit_unix upgrade yet.
    { id = "RUSTSEC-2026-0370", reason = "zvariant is pulled transitively via accesskit_unix/zbus 5.19 with no safe upstream upgrade available" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is pulled transitively via accesskit_unix/zbus 5.19 with no safe upstream upgrade available" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is pulled transitively via accesskit_unix/zbus 5.19 with no safe upstream upgrade available" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BlueOak-1.0.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"
deny = [
    { crate = "fnv", reason = "Standardize on const fn xxh64 via nve-hash" },
]

[bans.workspace-dependencies]
duplicates = "warn"
include-path-dependencies = false
unused = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Workspace [patch.crates-io] for Dioxus 0.7.10 WASM-size fixes (see docs/UPSTREAM.md).
    "https://github.com/samuelscheit/dioxus",
]
