name: Docs Site & GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/content/**"
      - "packages/framework/mdx/**"
      - "packages/framework/docs/**"
      - "packages/backends/web/**"
      - "packages/framework/router/**"
      - "packages/tools/cli/src/docs/**"
      - "examples/nve-docs-site/**"
      - "examples/studio-workspace/**"
      - "examples/counter/**"
      - "hosts/web-shell/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "nve-docs-pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Static Landing, Docs & Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain (wasm32-unknown-unknown)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Resolve locked wasm-bindgen version
        id: wbg
        run: |
          VER=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/, "", $3); print $3; exit}' Cargo.lock)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Cache wasm-bindgen-cli & wasm-tools binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-tools
          key: wasm-cli-${{ runner.os }}-wbg-${{ steps.wbg.outputs.version }}-v1

      - name: Install WASM build tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends binaryen brotli
          if [ ! -x "$HOME/.cargo/bin/wasm-bindgen" ]; then
            cargo install --locked wasm-bindgen-cli --version "${{ steps.wbg.outputs.version }}"
          fi
          if [ ! -x "$HOME/.cargo/bin/wasm-tools" ]; then
            cargo install --locked wasm-tools
          fi

      - name: Setup Node.js (terser JS glue minification)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build lazy-loaded WASM example apps (Studio & Counter)
        run: ./hosts/web-shell/build.sh studio counter

      - name: Build static SSR Landing, Docs & Examples site
        run: |
          cargo run --locked -p nve-cli -- docs build \
            --content docs/content \
            --out dist/docs \
            --base-path /native-view-engine \
            --site-url https://samuelscheit.github.io/native-view-engine \
            --web-shell-dist hosts/web-shell

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
