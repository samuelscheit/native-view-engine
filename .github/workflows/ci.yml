name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"
  release:
    types: [published, prereleased]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (Rust + Skia + WASM E2E + Python + C++/ASan + Qt6 Quick + GTK4 + Android JNI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Setup Node.js (for Web WASM CDP E2E)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run L2 hybrid lints (arch-invariants + ast-grep + cargo-deny)
        run: |
          cargo test --locked -p nve-arch-invariants
          npm install -g @ast-grep/cli@0.51.3
          ast-grep test && ast-grep scan
          cargo deny check

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: Install native dependencies
        if: false
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-4-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            xvfb \
            default-jdk

      - name: Build and test Rust workspace + Skia shell + WASM check
        run: |
          cargo build -p nve-example-kitchen-sink -p nve-studio-workspace
          cargo test --workspace --exclude nve-arch-invariants
          cargo test -p nve-backend-skia -p nve-skia-shell
          cargo clippy --locked -p nve-backend-skia --features skia -- -D warnings
          cargo clippy --locked -p nve-backend-skia --features skia-vulkan -- -D warnings
          cargo clippy --locked -p nve-skia-shell --features skia-vulkan -- -D warnings
          cargo run -p nve-skia-shell -- --help
          cargo bench --no-run
          cargo check -p nve-web-shell --target wasm32-unknown-unknown
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p nve-web-shell --target wasm32-unknown-unknown -- -D warnings
          cargo run --locked -p nve-cli -- codegen abi
          cargo run --locked -p nve-cli -- codegen abi --check

      - name: Run Python benchmark-regression unit tests
        run: python3 -B -m unittest discover -s scripts/tests -v

      - name: Build Web WASM bundle and run headless Chrome CDP E2E
        run: |
          CHROME_PATH=""
          for candidate in \
            "${NVE_CHROME_BIN:-}" \
            "${CHROME_BIN:-}" \
            /usr/bin/google-chrome \
            /usr/bin/google-chrome-stable \
            /usr/bin/chromium \
            /usr/bin/chromium-browser; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              CHROME_PATH="$candidate"
              break
            fi
          done
          if [ -z "$CHROME_PATH" ]; then
            for cmd in google-chrome google-chrome-stable chromium chromium-browser; do
              if command -v "$cmd" >/dev/null 2>&1; then
                CHROME_PATH="$(command -v "$cmd")"
                break
              fi
            done
          fi
          if [ -z "$CHROME_PATH" ]; then
            echo "error: Chrome/Chromium not present on runner; Web WASM E2E cannot be skipped in CI." >&2
            exit 1
          fi

          LOCKED_VER="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/, "", $3); print $3; exit}' Cargo.lock)"
          CLI_VER="$(wasm-bindgen --version 2>/dev/null | awk '{print $2}' || true)"
          if [ -n "$LOCKED_VER" ] && [ "$CLI_VER" != "$LOCKED_VER" ]; then
            cargo install --locked wasm-bindgen-cli --version "$LOCKED_VER"
          fi
          ./hosts/web-shell/build.sh --dev
          NVE_CHROME_BIN="$CHROME_PATH" node hosts/web-shell/e2e/run_e2e.mjs --no-screenshot

      - name: Verify docs content, static SSR build & headless Chrome E2E
        run: |
          cargo run --locked -p nve-cli -- docs check
          cargo run --locked -p nve-cli -- docs build \
            --content docs/content \
            --out dist/docs \
            --base-path /native-view-engine \
            --site-url https://samuelscheit.github.io/native-view-engine \
            --web-shell-dist hosts/web-shell
          node examples/nve-docs-site/e2e/run_docs_e2e.mjs dist/docs --base-path /native-view-engine --shots-dir /tmp/nve-landing-shots

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: Build and test C++20 Fabric bridge (Release + bench)
        if: false
        run: |
          cmake -S cxx/nve-fabric-bridge -B build/fabric-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNVE_BUILD_BENCHMARKS=ON
          cmake --build build/fabric-release
          ctest --test-dir build/fabric-release --output-on-failure
          ./build/fabric-release/nve_fabric_bridge_bench --iters 10

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: Build and test C++20 Fabric bridge (ASan + UBSan)
        if: false
        run: |
          cmake -S cxx/nve-fabric-bridge -B build/fabric-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNVE_BUILD_BENCHMARKS=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/fabric-asan
          ASAN_OPTIONS=detect_leaks=1 \
            UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ctest --test-dir build/fabric-asan --output-on-failure

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: Build and test Qt 6 host shell (Widgets + Quick Scene Graph offscreen)
        if: false
        run: |
          cmake -S hosts/qt-shell -B build/qt-shell -G Ninja
          cmake --build build/qt-shell
          test -x ./build/qt-shell/nve_qt_quick_test
          QT_QPA_PLATFORM=offscreen ctest --test-dir build/qt-shell --output-on-failure
          QT_QPA_PLATFORM=offscreen \
            NVE_TEST_KITCHEN_SINK_DYLIB="$PWD/target/debug/libnve_example_kitchen_sink.so" \
            NVE_TEST_STUDIO_DYLIB="$PWD/target/debug/libnve_studio_workspace.so" \
            ./build/qt-shell/nve_qt_shell_test
          QT_QPA_PLATFORM=offscreen \
            QT_QUICK_BACKEND=software \
            NVE_TEST_KITCHEN_SINK_DYLIB="$PWD/target/debug/libnve_example_kitchen_sink.so" \
            NVE_TEST_STUDIO_DYLIB="$PWD/target/debug/libnve_studio_workspace.so" \
            ./build/qt-shell/nve_qt_quick_test

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: Build and test GTK4 host shell (Xvfb)
        if: false
        run: |
          cmake -S hosts/gtk-shell -B build/gtk-shell -G Ninja
          cmake --build build/gtk-shell
          NVE_TEST_KITCHEN_SINK_DYLIB="$PWD/target/debug/libnve_example_kitchen_sink.so" \
            NVE_TEST_STUDIO_DYLIB="$PWD/target/debug/libnve_studio_workspace.so" \
            xvfb-run -a ctest --test-dir build/gtk-shell --output-on-failure

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: Build and test Android JNI host bridge
        if: false
        run: |
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          cmake -S hosts/android-shell -B build/android-shell -G Ninja
          cmake --build build/android-shell
          ctest --test-dir build/android-shell --output-on-failure

  # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
  android-compose:
    if: false
    name: Android Compose Kit (Gradle Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate NVE ABI & Wire Codec bindings
        run: |
          cargo run --locked -p nve-cli -- codegen abi
          cargo run --locked -p nve-cli -- codegen abi --check

      - name: Ensure Android SDK platform 35 is available
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -d "$SDK_ROOT/platforms/android-35" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Run Android Compose Kit unit tests
        run: ./hosts/compose-kit/run-tests.sh testDebugUnitTest --console=plain

  macos:
    name: macOS (Rust + Skia)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: Install Ninja and CMake
        if: false
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          command -v ninja >/dev/null 2>&1 || brew install ninja

      - name: Build and test Rust workspace + Skia shell
        run: |
          cargo build -p nve-example-kitchen-sink -p nve-studio-workspace
          cargo test --workspace --exclude nve-arch-invariants
          cargo test -p nve-backend-skia -p nve-skia-shell
          cargo clippy --locked -p nve-backend-skia --features skia -- -D warnings
          cargo clippy --locked -p nve-backend-skia --features skia-metal -- -D warnings
          cargo clippy --locked -p nve-skia-shell --features skia-metal -- -D warnings
          cargo run -p nve-skia-shell -- --help
          cargo bench --no-run
          cargo run --locked -p nve-cli -- codegen abi
          cargo run --locked -p nve-cli -- codegen abi --check

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: Build and test C++20 Fabric bridge
        if: false
        run: |
          cmake -S cxx/nve-fabric-bridge -B build/fabric-bridge -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNVE_BUILD_BENCHMARKS=ON
          cmake --build build/fabric-bridge
          ctest --test-dir build/fabric-bridge --output-on-failure
          ./build/fabric-bridge/nve_fabric_bridge_bench --iters 10

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: Build and test C++20 Fabric bridge (ASan + UBSan)
        if: false
        run: |
          cmake -S cxx/nve-fabric-bridge -B build/fabric-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNVE_BUILD_BENCHMARKS=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/fabric-asan
          ASAN_OPTIONS=detect_leaks=0 \
            UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ctest --test-dir build/fabric-asan --output-on-failure

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: Build and test macOS AppKit host shell
        if: false
        run: |
          cmake -S hosts/macos-shell -B build/macos-shell -G Ninja
          cmake --build build/macos-shell
          ctest --test-dir build/macos-shell --output-on-failure
          NVE_TEST_KITCHEN_SINK_DYLIB="$PWD/target/debug/libnve_example_kitchen_sink.dylib" \
            NVE_TEST_STUDIO_DYLIB="$PWD/target/debug/libnve_studio_workspace.dylib" \
            ./build/macos-shell/nve_macos_shell_test

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: iOS Simulator SDK Objective-C++ syntax check
        if: false
        run: |
          xcrun --sdk iphonesimulator clang++ \
            -std=c++20 -fobjc-arc -Wall -Wextra -Werror -fsyntax-only \
            -Icxx/nve-fabric-bridge/include \
            -Ihosts/apple-common \
            -Ihosts/ios-shell \
            hosts/apple-common/*.mm \
            hosts/ios-shell/*.mm

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: Test SwiftUI host kit
        if: false
        run: swift test --package-path hosts/swiftui-kit

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: Setup Flutter
        if: false
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: Analyze and test Flutter host plugin
        if: false
        working-directory: hosts/flutter-plugin
        run: |
          flutter pub get
          flutter analyze
          flutter test

  windows:
    name: Windows (Rust MSVC + Skia)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and test Rust workspace + Skia shell
        shell: pwsh
        run: |
          cargo build -p nve-example-kitchen-sink -p nve-studio-workspace
          cargo test --workspace --exclude nve-arch-invariants
          cargo test -p nve-backend-skia -p nve-skia-shell
          cargo clippy --locked -p nve-backend-skia --features skia -- -D warnings
          cargo clippy --locked -p nve-backend-skia --features skia-d3d -- -D warnings
          cargo clippy --locked -p nve-skia-shell --features skia-d3d -- -D warnings
          cargo run -p nve-skia-shell -- --help
          cargo bench --no-run
          cargo run --locked -p nve-cli -- codegen abi
          cargo run --locked -p nve-cli -- codegen abi --check

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: Build and test C++20 Fabric bridge
        if: false
        shell: pwsh
        run: |
          cmake -S cxx/nve-fabric-bridge -B build/fabric-bridge -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DNVE_BUILD_BENCHMARKS=ON
          cmake --build build/fabric-bridge
          ctest --test-dir build/fabric-bridge --output-on-failure
          .\build\fabric-bridge\nve_fabric_bridge_bench.exe --iters 10

      # Temporarily disabled until Track 1B-2 rebinds native hosts to libnve_runtime
      - name: Build and test Windows host shell
        if: false
        shell: pwsh
        run: |
          cmake -S hosts/windows-shell -B build/windows-shell -G Ninja
          cmake --build build/windows-shell
          $env:NVE_TEST_KITCHEN_SINK_DYLIB = (Resolve-Path target\debug\nve_example_kitchen_sink.dll).Path
          $env:NVE_TEST_STUDIO_DYLIB = (Resolve-Path target\debug\nve_studio_workspace.dll).Path
          ctest --test-dir build/windows-shell --output-on-failure
