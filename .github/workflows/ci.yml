name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (Rust + WASM + C++/ASan + Qt6 + GTK4 + Android JNI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-4-dev \
            qt6-base-dev \
            xvfb \
            default-jdk

      - name: Build and test Rust workspace + WASM check
        run: |
          cargo build -p nve-example-counter
          cargo test --workspace
          cargo bench --no-run
          cargo check -p nve-web-shell --target wasm32-unknown-unknown

      - name: Build and test C++20 Fabric bridge (Release + bench)
        run: |
          cmake -S cxx/nve-fabric-bridge -B build/fabric-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNVE_BUILD_BENCHMARKS=ON
          cmake --build build/fabric-release
          ctest --test-dir build/fabric-release --output-on-failure
          ./build/fabric-release/nve_fabric_bridge_bench --iters 10

      - name: Build and test C++20 Fabric bridge (ASan + UBSan)
        run: |
          cmake -S cxx/nve-fabric-bridge -B build/fabric-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNVE_BUILD_BENCHMARKS=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/fabric-asan
          ASAN_OPTIONS=detect_leaks=1 \
            UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ctest --test-dir build/fabric-asan --output-on-failure

      - name: Build and test Qt 6 host shell (offscreen)
        run: |
          cmake -S hosts/qt-shell -B build/qt-shell -G Ninja
          cmake --build build/qt-shell
          QT_QPA_PLATFORM=offscreen ctest --test-dir build/qt-shell --output-on-failure
          QT_QPA_PLATFORM=offscreen \
            NVE_TEST_COUNTER_DYLIB="$PWD/target/debug/libnve_example_counter.so" \
            ./build/qt-shell/nve_qt_shell_test

      - name: Build and test GTK4 host shell (Xvfb)
        run: |
          cmake -S hosts/gtk-shell -B build/gtk-shell -G Ninja
          cmake --build build/gtk-shell
          NVE_TEST_COUNTER_DYLIB="$PWD/target/debug/libnve_example_counter.so" \
            xvfb-run -a ctest --test-dir build/gtk-shell --output-on-failure

      - name: Build and test Android JNI host bridge
        run: |
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          cmake -S hosts/android-shell -B build/android-shell -G Ninja
          cmake --build build/android-shell
          ctest --test-dir build/android-shell --output-on-failure

  macos:
    name: macOS (Rust + C++ + AppKit + iOS SDK + SwiftUI + Flutter)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Ninja and CMake
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          command -v ninja >/dev/null 2>&1 || brew install ninja

      - name: Build and test Rust workspace
        run: |
          cargo build -p nve-example-counter
          cargo test --workspace
          cargo bench --no-run

      - name: Build and test C++20 Fabric bridge
        run: |
          cmake -S cxx/nve-fabric-bridge -B build/fabric-bridge -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNVE_BUILD_BENCHMARKS=ON
          cmake --build build/fabric-bridge
          ctest --test-dir build/fabric-bridge --output-on-failure
          ./build/fabric-bridge/nve_fabric_bridge_bench --iters 10

      - name: Build and test macOS AppKit host shell
        run: |
          cmake -S hosts/macos-shell -B build/macos-shell -G Ninja
          cmake --build build/macos-shell
          ctest --test-dir build/macos-shell --output-on-failure
          NVE_TEST_COUNTER_DYLIB="$PWD/target/debug/libnve_example_counter.dylib" \
            ./build/macos-shell/nve_macos_shell_test

      - name: iOS Simulator SDK Objective-C++ syntax check
        run: |
          xcrun --sdk iphonesimulator clang++ \
            -std=c++20 -fobjc-arc -Wall -Wextra -Werror -fsyntax-only \
            -Icxx/nve-fabric-bridge/include \
            -Ihosts/apple-common \
            -Ihosts/ios-shell \
            hosts/apple-common/*.mm \
            hosts/ios-shell/*.mm

      - name: Test SwiftUI host kit
        run: swift test --package-path hosts/swiftui-kit

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze and test Flutter host plugin
        working-directory: hosts/flutter-plugin
        run: |
          flutter pub get
          flutter analyze
          flutter test

  windows:
    name: Windows (Rust MSVC + C++ Fabric + Windows Host)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and test Rust workspace
        shell: pwsh
        run: |
          cargo build -p nve-example-counter
          cargo test --workspace
          cargo bench --no-run

      - name: Build and test C++20 Fabric bridge
        shell: pwsh
        run: |
          cmake -S cxx/nve-fabric-bridge -B build/fabric-bridge -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DNVE_BUILD_BENCHMARKS=ON
          cmake --build build/fabric-bridge
          ctest --test-dir build/fabric-bridge --output-on-failure
          .\build\fabric-bridge\nve_fabric_bridge_bench.exe --iters 10

      - name: Build and test Windows host shell
        shell: pwsh
        run: |
          cmake -S hosts/windows-shell -B build/windows-shell -G Ninja
          cmake --build build/windows-shell
          $env:NVE_TEST_COUNTER_DYLIB = (Resolve-Path target\debug\nve_example_counter.dll).Path
          ctest --test-dir build/windows-shell --output-on-failure
